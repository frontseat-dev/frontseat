# Podman of the local stack: rootless, as the user frontseat, in the cgroup
# frontseat-stack init delegates to it. No session keyring and no default
# sysctls: the container's seccomp profile and its /proc refuse both.
# Nothing of Podman's own in a sandbox's hosts file, neither the stack
# container's entries nor a name of its own for this machine
# (host.docker.internal): a name a sandbox reaches is answered by
# OpenShell's DNS, whose answers alone its proxy lets the sandbox connect
# to by name. OpenShell's own entries are kept.
[containers]
base_hosts_file = "none"
host_containers_internal_ip = "none"
cgroupns = "host"
keyring = false
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[network]
default_rootless_network_cmd = "slirp4netns"
