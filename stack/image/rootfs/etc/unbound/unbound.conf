# The container's own resolver: what the container's resolv.conf names,
# and so what the processes of the container that read it ask, the
# sandboxes' supervisors among them (stack Resolver). It asks the
# nameservers the runtime gave the container (forward.conf, which
# frontseat-stack init writes), keeps what they say, asks again where an
# answer is lost, and serves what it kept where they say nothing in time.
server:
	interface: 127.0.0.1
	port: 53
	access-control: 127.0.0.0/8 allow
	# A runtime may give the container a nameserver of IPv6 alone.
	do-ip6: yes
	username: "dns"
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	use-syslog: no
	logfile: ""
	verbosity: 1
	# It forwards, and validates nothing: the runtime's nameservers are
	# what the container trusts.
	module-config: "iterator"
	# A runtime's nameserver may be on the container's loopback.
	do-not-query-localhost: no
	prefetch: yes
	# What it kept, served where the nameservers say nothing within 1.8 s:
	# a supervisor waits two seconds for an answer, once.
	serve-expired: yes
	# For an hour at most: an address that has changed is given no longer.
	serve-expired-ttl: 3600
	serve-expired-client-timeout: 1800
	# With one nameserver to ask, one marked down after timeouts (a
	# network that dropped, a machine that slept) is asked again soon,
	# and kept being asked, rather than left for fifteen minutes behind
	# what was kept.
	infra-keep-probing: yes
	infra-host-ttl: 60
	# Many sandboxes ask at once: as many threads as a small machine has,
	# each with its own socket (so-reuseport), and room to queue what is
	# asked, which two threads and the defaults lacked. The buffers are
	# what the kernel allows at most (net.core.rmem_max, which the
	# container cannot raise); the threads and the queues are the rest.
	num-threads: 4
	so-reuseport: yes
	so-rcvbuf: 4m
	so-sndbuf: 4m
	num-queries-per-thread: 4096
	outgoing-range: 8192

include: "/etc/unbound/forward.conf"
