// frontseat.build.v1alpha1: builds. A build builds targets, on the
// daemon of a workspace. A release builds too: it makes a build of its
// own (ReleaseService, release.proto). A build is a resource: it has an
// id, it outlives the call that made it, and anything that may see it
// can watch it, read its results and cancel it.
//
// A daemon keeps every build that has not ended. Of those that have, it
// keeps the twelve newest, and any other until five minutes after it
// ended, and it keeps them when it is started again: a build that was
// under way when its daemon stopped has ended in error. A build the
// daemon no longer keeps is not listed, and a call that names it is
// refused NOT_FOUND (BUILD_NOT_FOUND).
//
// What the build API's services refuse by name carries ErrorInfo of the
// domain build.frontseat.dev, with the reason each call names.
syntax = "proto3";

package frontseat.build.v1alpha1;

import "frontseat/build/v1alpha1/types.proto";
import "frontseat/type/v1alpha1/diagnostic.proto";
import "frontseat/type/v1alpha1/types.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// BuildService is a workspace's builds.
service BuildService {
  // CreateBuild starts a build and returns at once. The build goes on if the
  // caller goes away: StreamBuildEvents follows it until it ends, and
  // CancelBuild stops it. Sent again with the same request_id, it returns
  // the build the first call made, and starts none, for as long as the
  // daemon remembers the request_id (CreateBuildRequest.request_id).
  //
  // A mistake in what the source says, a target that points at nothing
  // and a name no action has are not errors of this call: the build is
  // made, and ends at once as a build that failed, saying what is wrong.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the profile is one nobody defined
  //   (PROFILE_UNKNOWN), or the request_id is longer than 128 bytes
  //   (REQUEST_ID_INVALID).
  // - FAILED_PRECONDITION: the workspace holds no repository that is
  //   ready to build (WORKSPACE_NOT_READY).
  // - UNAVAILABLE: the daemon is ending (DAEMON_ENDING).
  rpc CreateBuild(CreateBuildRequest) returns (CreateBuildResponse);

  // DescribeBuild returns one build, as it is now. Use ListBuildActions for what
  // each of its actions did.
  //
  // ### Errors
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND).
  rpc DescribeBuild(DescribeBuildRequest) returns (DescribeBuildResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListBuilds returns the builds the daemon keeps of the workspace,
  // newest first, a page at a time. A page token names a position in
  // that list: where a build is made or let go of between two pages, the
  // next page may repeat a build or leave one out.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelBuild stops a build: nothing new starts, and what is executing is
  // cancelled on the grid. Cancelling a build that has ended succeeds and
  // changes nothing.
  //
  // ### Errors
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND).
  rpc CancelBuild(CancelBuildRequest) returns (CancelBuildResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // WaitBuild returns the build once it has ended. StreamBuildEvents follows
  // what the build does on the way.
  //
  // ### Errors
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND).
  rpc WaitBuild(WaitBuildRequest) returns (WaitBuildResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StreamBuildEvents streams a build's events from a sequence number, in
  // order, then each as it happens, until the build ends. The daemon keeps
  // every event of a build while it lives, so a stream that breaks is called
  // again from the sequence after the last it saw, and a build that has
  // ended is replayed from zero.
  //
  // ### Errors
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND).
  // - OUT_OF_RANGE: the build has ended, and the sequence is beyond its last
  //   event (SEQUENCE_OUT_OF_RANGE).
  rpc StreamBuildEvents(StreamBuildEventsRequest) returns (stream StreamBuildEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListBuildActions returns what each of a build's actions did: its outcome,
  // where its result came from, how long it took, and the digests of what
  // it printed. This is the build's checks: one entry per action. While
  // the build runs, an action's entry changes as the action ends.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND).
  rpc ListBuildActions(ListBuildActionsRequest) returns (ListBuildActionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StreamBuildLogs sends what one action printed, once the action has
  // ended: everything it wrote to standard output, then everything it
  // wrote to standard error, each from its first line. It does not
  // follow an action that is still running: for one the build has
  // planned and that has not ended, it sends nothing. It does not say
  // how the two outputs were interleaved, and its lines carry no time.
  // It is sent in parts, each some whole lines, so an action may have
  // printed any amount.
  //
  // A line's text is UTF-8: bytes an action printed that are not are
  // given as U+FFFD.
  //
  // ### Errors
  // - NOT_FOUND: no build has that id (BUILD_NOT_FOUND), or the build
  //   has planned no such action (ACTION_NOT_FOUND).
  // - INTERNAL: what the action printed could not be read from where the
  //   daemon keeps it.
  rpc StreamBuildLogs(StreamBuildLogsRequest) returns (stream StreamBuildLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Build is one build of targets: what `frontseat build` starts.
message Build {
  // Id is the build's id, "build_" and what the server chose.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Targets are the targets asked for, as they were written.
  repeated string targets = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // State is where the build is.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Stage is what a running build is doing now.
  Stage stage = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `exit_code` is how the build ended, in Bazel's names and numbers; unset
  // until it has.
  ExitCode exit_code = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Failure says, for a build that ended in an error no action explains,
  // what went wrong. Describing a failed build still succeeds. Empty for a
  // build that did not so fail.
  string failure = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Diagnostics are what the source was found to say wrong, where that is
  // the failure: each a rule, a message, a source location and what to
  // do, as the plugin or the host that found it says them, so that a
  // client reads the file and the rule without parsing the failure.
  repeated frontseat.type.v1alpha1.Diagnostic diagnostics = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `create_time` is when the build was made.
  google.protobuf.Timestamp create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `end_time` is when it ended; unset until it has.
  google.protobuf.Timestamp end_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Counts are its actions by outcome, as they stand.
  Counts counts = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Cost is what the build used.
  Cost cost = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Profile is the name of the profile the source was built with: never
  // empty.
  string profile = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `last_sequence` is the sequence of the build's latest event.
  int64 last_sequence = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is where a build is.
  enum State {
    // STATE_UNSPECIFIED: not known.
    STATE_UNSPECIFIED = 0;
    // STATE_RUNNING: it has not ended.
    STATE_RUNNING = 1;
    // STATE_FINISHED: it ended, and exit_code says how.
    STATE_FINISHED = 2;
    // STATE_CANCELLED: it was cancelled before it ended.
    STATE_CANCELLED = 3;
  }

  // Stage is what a running build is doing.
  enum Stage {
    // STAGE_UNSPECIFIED: not known.
    STAGE_UNSPECIFIED = 0;
    // STAGE_EVALUATING: reading the source and asking the plugins.
    STAGE_EVALUATING = 1;
    // STAGE_EXECUTING: running actions.
    STAGE_EXECUTING = 3;
  }
}

// Counts are a build's actions by outcome. Once the build has ended,
// passed, failed, skipped, errored and idle add up to total.
message Counts {
  // Total is how many actions the build selected.
  int32 total = 1;
  // Passed is how many passed (OUTCOME_PASSED).
  int32 passed = 2;
  // Failed is how many ran and did not pass (OUTCOME_FAILED), and how
  // many checks would rewrite the source (OUTCOME_REWRITE).
  int32 failed = 3;
  // Skipped is how many did not run because something they need did not
  // pass (OUTCOME_SKIPPED), and, once the build has ended, how many it
  // never reached, as when it was cancelled.
  int32 skipped = 4;
  // Errored is how many could not be run (OUTCOME_ERROR).
  int32 errored = 5;
  // Idle is how many were not run, having nothing to do (OUTCOME_IDLE).
  int32 idle = 6;
}

// Cost is what a build used: what a budget counts.
message Cost {
  // `actions_executed` is how many actions a worker ran.
  int32 actions_executed = 1;
  // `worker_time` is the time workers spent running them, summed.
  google.protobuf.Duration worker_time = 2;
  // `wall_time` is how long the build took.
  google.protobuf.Duration wall_time = 3;
}

// ActionResult is what one action of a build did. It is the build's check for
// that action.
message ActionResult {
  // Label is the action's label, its address in the workspace:
  // "//payments:go.test-internal-ledger".
  string label = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Entity is the entity that owns the action; unset when none does.
  frontseat.type.v1alpha1.EntityRef entity = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Name is the action's name within its plugin: "test", "lint".
  string name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Outcome is how it ended; unspecified while it has not.
  Outcome outcome = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Provenance is where its result came from.
  Provenance provenance = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `exit_code` is the command's exit code.
  int32 exit_code = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Message says, for an outcome of error, what failed; for a skipped
  // action, what it needed that did not pass.
  string message = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `action_digest` is the action's digest on the grid: what a portal links
  // to, and what two builds are compared by.
  Digest action_digest = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `start_time` is when it started; unset for one answered from a cache.
  google.protobuf.Timestamp start_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Duration is how long it took, as the build saw it.
  google.protobuf.Duration duration = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `worker_time` is how long a worker spent running it, as the worker
  // says; unset for one no worker ran for this build. What a build cost its
  // workers is the sum of these.
  google.protobuf.Duration worker_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Stdout is what it printed.
  Digest stdout = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Stderr is what it printed to standard error.
  Digest stderr = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Diagnostics are what a check found, as its plugin reports them: each
  // a rule, a message, a source location and what to do.
  repeated frontseat.type.v1alpha1.Diagnostic diagnostics = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rewrites are the changes to source a check proposed, and whether the
  // build wrote them.
  repeated Rewrite rewrites = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Rewrite is a change to one source file a fix made, as a build records
// it: the content by digest, and whether the build wrote it to the
// daemon's checkout, which it does only over the content the build read.
message Rewrite {
  // Kind is what the change is.
  enum Kind {
    // KIND_UNSPECIFIED: no change was said.
    KIND_UNSPECIFIED = 0;
    // KIND_REPLACE: the file holds the content, and is executable or
    // not, as the change says.
    KIND_REPLACE = 1;
    // KIND_CREATE: a file that was not there was written.
    KIND_CREATE = 2;
    // KIND_DELETE: the file was removed.
    KIND_DELETE = 3;
  }
  // Location is the file; its line is zero.
  frontseat.type.v1alpha1.SourceLocation location = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Kind is what the change is.
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Content is the file's bytes after the change; unset for a delete.
  Digest content = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Executable is whether the file may be run after the change.
  bool executable = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `rule_id` is the rule the change satisfies.
  string rule_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Applied is whether the build wrote it to the daemon's checkout.
  bool applied = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreateBuildRequest starts a build.
message CreateBuildRequest {
  // Targets select what to run it over, in the target grammar; empty is
  // everything in the workspace.
  repeated string targets = 2;
  // Fix asks that each check with a fix has it run where the checkout
  // is, before the check, and what it changes written to the daemon's
  // checkout; without it a check only reports, and fails the build.
  bool fix = 5;
  // Profile is the name of the profile the source is built with. Empty,
  // it is `development`. A build may ask for `production`, to see that
  // what will be released builds: a release builds with it. Those two
  // are the profiles frontseat defines; any other name is refused
  // (PROFILE_UNKNOWN).
  string profile = 12;
  // Only keeps the actions that have one of these names, such as
  // "lint", of whatever the targets point at. Empty keeps every action.
  // A name no action has fails the build, which says so in its failure.
  repeated string only = 13;
  // Tests keeps the actions that run tests, as the plugin that declared
  // each says (its test flag), of whatever the targets point at, and
  // what they need. Where they hold none, the build runs nothing and
  // ends with the exit code NO_TESTS_FOUND, 4, saying so in its failure,
  // as Bazel ends `bazel test` with no test targets.
  bool tests = 15;
  // `request_id` makes a retry return the build the first call made: a
  // client that lost the answer sends the same request again with it.
  // It is at most 128 bytes; a UUID serves. The daemon remembers the
  // 4096 newest it was sent, while it runs and still keeps the build
  // each made: one it has forgotten, or one sent to a daemon started
  // again since, starts another build. What is sent with it again is
  // not compared with the first request. Empty, every call starts a
  // build.
  string request_id = 14;
}

// CreateBuildResponse is the build that was made.
message CreateBuildResponse {
  // Build is the build.
  Build build = 1;
}

// DescribeBuildRequest names a build.
message DescribeBuildRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DescribeBuildResponse is one build.
message DescribeBuildResponse {
  // Build is the build.
  Build build = 1;
}

// ListBuildsRequest asks for a page of the workspace's builds.
message ListBuildsRequest {
  // `page_size` is the most builds to return; zero is a hundred, and more
  // than a thousand is a thousand.
  int32 page_size = 1;
  // `page_token` is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 2;
}

// ListBuildsResponse is a page of the workspace's builds.
message ListBuildsResponse {
  // Builds are the builds, newest first.
  repeated Build builds = 1;
  // `next_page_token` asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// CancelBuildRequest names a build to stop.
message CancelBuildRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// CancelBuildResponse is the build as it was cancelled.
message CancelBuildResponse {
  // Build is the build.
  Build build = 1;
}

// WaitBuildRequest names the build to wait for.
message WaitBuildRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// WaitBuildResponse is the build, ended.
message WaitBuildResponse {
  // Build is the build.
  Build build = 1;
}

// StreamBuildEventsRequest names a build and where to start.
message StreamBuildEventsRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
  // `from_sequence` is the first event to send, from 1; zero is the first.
  int64 from_sequence = 2;
}

// StreamBuildEventsResponse is the next events.
message StreamBuildEventsResponse {
  // Events are the next events, in order.
  repeated BuildEvent events = 1;
}

// ListBuildActionsRequest names a build whose actions are listed.
message ListBuildActionsRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
  // `page_size` is the most actions to return; zero is a hundred, and more
  // than a thousand is a thousand.
  int32 page_size = 3;
  // `page_token` is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 4;
}

// ListBuildActionsResponse is a page of a build's actions.
message ListBuildActionsResponse {
  // Actions are the actions, in the order the build planned them.
  repeated ActionResult actions = 1;
  // `next_page_token` asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// StreamBuildLogsRequest names an action of a build.
message StreamBuildLogsRequest {
  // `build_id` is the build's id.
  string build_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Label is the action's label.
  string label = 2 [(google.api.field_behavior) = REQUIRED];
}

// StreamBuildLogsResponse is the next lines of what an action printed.
message StreamBuildLogsResponse {
  // Lines are the next lines, in order.
  repeated frontseat.type.v1alpha1.LogLine lines = 1;
}

// BuildEvent is one thing that happened in a build. A client that shows
// a build's progress needs these events and nothing else.
message BuildEvent {
  // Sequence numbers the build's events from 1, with no gaps.
  int64 sequence = 1;
  // Time is when it happened.
  google.protobuf.Timestamp time = 2;
  // Event is what happened.
  oneof event {
    // `stage_changed`: the build moved to another stage.
    StageChanged stage_changed = 3;
    // Planned: the build knows its actions.
    Planned planned = 4;
    // `action_started`: an action began.
    ActionStarted action_started = 5;
    // `action_finished`: an action ended.
    ActionFinished action_finished = 6;
    // Patched: the daemon wrote what a fix changed to its own checkout.
    Patched patched = 7;
    // Finished: the build ended. It is the build's last event.
    Finished finished = 8;
    // `started_over`: the build began again from its plan.
    StartedOver started_over = 9;
  }

  // StageChanged is the build moving to another stage.
  message StageChanged {
    // Stage is the stage it moved to.
    Build.Stage stage = 1;
  }

  // Planned lists every action the build will run or answer for, so
  // that a reader knows from the start how many are still to end.
  message Planned {
    // Actions are the build's actions, in dependency order.
    repeated PlannedAction actions = 1;
    // Roots are the labels the targets named.
    repeated string roots = 2;
  }

  // PlannedAction is one action of a build's plan.
  message PlannedAction {
    // Label is the action's label.
    string label = 1;
    // Entity is the entity that owns it; unset when none does.
    frontseat.type.v1alpha1.EntityRef entity = 2;
    // Name is its name within its plugin: "test", "lint".
    string name = 3;
    // Needs are the labels of the actions it waits for.
    repeated string needs = 4;
  }

  // ActionStarted is an action beginning: handed to the grid, or looked
  // up in a cache.
  message ActionStarted {
    // Label is the action's label.
    string label = 1;
  }

  // ActionFinished is an action ending.
  message ActionFinished {
    // Result is what it did.
    ActionResult result = 1;
  }

  // Patched is a fix applied to the daemon's own checkout.
  message Patched {
    // Repository is the workspace's name for the repository.
    string repository = 1;
    // Paths are the files it changed, relative to the repository.
    repeated string paths = 2;
  }

  // StartedOver is the build beginning again from its plan. It happens
  // at most once in a build: the grid no longer held an input of one of
  // its actions, a tool or another action's output, so the action that
  // makes that input has to run again. What the build's actions did
  // before this event is no part of its result: every action is
  // planned, started and finished again after it. A build that loses an
  // input a second time ends in error.
  message StartedOver {
    // Label is the action whose input the grid no longer held.
    string label = 1;
    // Reason is what the grid said.
    string reason = 2;
  }

  // Finished is the build's end.
  message Finished {
    // Build is the build as it ended.
    Build build = 1;
  }
}

// ExitCode is how a build ended, in Bazel's names and numbers.
message ExitCode {
  // Name is Bazel's name for it. A daemon says SUCCESS (0), BUILD_FAILURE
  // (1), TESTS_FAILED (3), NO_TESTS_FOUND (4), INTERRUPTED (8) and
  // INTERNAL_ERROR (37); a client must accept one it does not know.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Code is the process exit code, e.g. 0 for SUCCESS.
  int32 code = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}
