// frontseat.credential.v1alpha1: credentials. A credential is a secret
// for a host, a password or a token, which a person gives the control
// plane so that their workspaces can fetch from the host, and push to
// it. It is that person's: a workspace uses its owner's credential for a
// host, and no one else's. It is kept outside every sandbox: a
// workspace's sandbox sends a stand-in, which is replaced by the secret
// on the way out, and never holds the secret itself.
//
// Every call is a person's, known by the token they present as a bearer
// token. A call that presents none, or one the control plane does not
// know, is refused UNAUTHENTICATED, with the reason IDENTITY_MISSING or
// IDENTITY_INVALID in ErrorInfo, of the control plane's own domain,
// frontseat.dev.
// What this service refuses by name carries ErrorInfo of the domain
// credential.frontseat.dev, with the reason each call names.
syntax = "proto3";

package frontseat.credential.v1alpha1;

import "google/api/field_behavior.proto";

// CredentialService is the credentials of the person who asks: theirs
// alone, each for one host.
service CredentialService {
  // SetCredential keeps the caller's credential for a host, in place of
  // the one they had for it. Workspaces of theirs made afterwards use
  // it for that host; a workspace made before goes on using the
  // credential it was made with, until that one is deleted.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the host is not a host name, as Credential.host
  //   says (CREDENTIAL_HOST_INVALID); the username is not one, as
  //   Credential.username says (CREDENTIAL_USERNAME_INVALID); or no
  //   secret is given, or one longer than 4096 bytes or of more than one
  //   line (CREDENTIAL_SECRET_INVALID). What keeps credentials outside
  //   the sandboxes refuses by the same reasons what it finds not well
  //   formed.
  // - UNIMPLEMENTED: this control plane's sandboxes keep no credential
  //   outside them (CREDENTIALS_NOT_SERVED).
  // - UNAVAILABLE: it could not be kept (CREDENTIAL_NOT_KEPT).
  rpc SetCredential(SetCredentialRequest) returns (SetCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCredentials returns the caller's credentials, by host, a page at
  // a time: never their secrets. A page token names a position in that
  // list: where a credential is set or deleted between two pages, the
  // next page may repeat one or leave one out.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteCredential removes the caller's credential for a host.
  // Deleting one for a host they keep none for succeeds.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the host is not a host name
  //   (CREDENTIAL_HOST_INVALID).
  // - FAILED_PRECONDITION: a workspace of the caller's still uses it; it
  //   can be deleted once those workspaces have ended
  //   (CREDENTIAL_IN_USE).
  // - UNIMPLEMENTED: this control plane's sandboxes keep no credential
  //   outside them (CREDENTIALS_NOT_SERVED).
  // - UNAVAILABLE: it could not be removed (CREDENTIAL_NOT_KEPT).
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Credential is a person's credential for one host.
message Credential {
  // Host is the host it is for: a name, or a name and a port as
  // name:port, never an address. Without a port it is port 443, and the
  // credential is sent over https alone. Written with "http://" before
  // it, and then port 80 where none is given, it is sent over http,
  // unencrypted, by any program in a workspace that uses it: for such a
  // host, give a credential that may do no more than it must.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
  // Username is the user it is for, as the host knows them: at most
  // 128 letters, digits, dots, underscores, hyphens and at signs. It is
  // not secret: a workspace that uses the credential is told it.
  string username = 2;
  // Secret is the password or token: one line, of at most 4096 bytes.
  // It is kept outside every sandbox, and no call returns it.
  string secret = 3 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
}

// SetCredentialRequest is a credential to keep.
message SetCredentialRequest {
  // Credential is the credential.
  Credential credential = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetCredentialResponse is the credential as it is kept.
message SetCredentialResponse {
  // Credential is the credential, without its secret.
  Credential credential = 1;
}

// ListCredentialsRequest asks for a page of the caller's credentials.
message ListCredentialsRequest {
  // `page_size` is the most credentials to return; zero is a hundred,
  // and more than a thousand is a thousand.
  int32 page_size = 1;
  // `page_token` is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 2;
}

// ListCredentialsResponse is a page of the caller's credentials.
message ListCredentialsResponse {
  // Credentials are the credentials, by host, without their secrets.
  repeated Credential credentials = 1;
  // `next_page_token` asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// DeleteCredentialRequest names the host whose credential is removed.
message DeleteCredentialRequest {
  // Host is the host, written as it was to SetCredential.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteCredentialResponse is empty: the caller keeps no credential for
// the host.
message DeleteCredentialResponse {}
