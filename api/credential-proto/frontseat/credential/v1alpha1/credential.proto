// frontseat.credential.v1alpha1: credentials. A credential is a secret
// for a host, a password or a token, which a person gives the control
// plane so that their workspaces fetch from the host, and push to it,
// with it. It is that person's: a workspace is let through with its
// owner's credential for a host, and with no one else's. It is kept
// outside every sandbox: a sandbox presents a stand-in, which is traded
// for the secret on its way out, and never holds the secret itself.
//
// Every call is a person's, known by the token they present as a bearer
// token. A call that presents none, or one the control plane does not
// know, is refused UNAUTHENTICATED, with the reason IDENTITY_MISSING or
// IDENTITY_INVALID in ErrorInfo, of the domain workspace.frontseat.dev.
// What this service refuses by name carries ErrorInfo of the domain
// credential.frontseat.dev, with the reason each call names.
syntax = "proto3";

package frontseat.credential.v1alpha1;

import "google/api/field_behavior.proto";

// CredentialService is the credentials of the person who asks: theirs
// alone, each for one host.
service CredentialService {
  // SetCredential keeps the caller's credential for a host, in place of
  // the one they had for it. Their workspaces made after are let through
  // to the host with it; a workspace already made is let through with
  // the one it was made with, until that one is let go of.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the host is no host's name (CREDENTIAL_HOST_INVALID),
  //   the username is no username (CREDENTIAL_USERNAME_INVALID), or no
  //   secret is given, or one of more than one line
  //   (CREDENTIAL_SECRET_INVALID).
  // - FAILED_PRECONDITION: what makes sandboxes keeps no credential
  //   outside them.
  // - UNAVAILABLE: it could not be kept.
  rpc SetCredential(SetCredentialRequest) returns (SetCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // DescribeCredential returns the caller's credential for a host: never
  // its secret.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the host is no host's name (CREDENTIAL_HOST_INVALID).
  // - NOT_FOUND: the caller keeps no credential for the host
  //   (CREDENTIAL_NOT_FOUND).
  rpc DescribeCredential(DescribeCredentialRequest) returns (DescribeCredentialResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListCredentials returns the caller's credentials, by host, a page at
  // a time: never their secrets.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteCredential lets go of the caller's credential for a host. A
  // host they keep none for is no error.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the host is no host's name (CREDENTIAL_HOST_INVALID).
  // - FAILED_PRECONDITION: a workspace is still let through with it; it
  //   is let go of once those workspaces have ended (CREDENTIAL_IN_USE).
  // - UNAVAILABLE: it could not be let go of.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Credential is a person's credential for one host.
message Credential {
  // Host is the host it is for: a name, or a name and a port as
  // name:port; without a port, 443, and sent over https alone. Written
  // with "http://" before it, and then port 80 where none is given, it is
  // sent over http, unencrypted, by whatever runs in a workspace let
  // through with it: give such a host one that reads no more than it
  // must.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
  // Username is who it is of, as the host asks; it is no secret, and a
  // workspace is told it.
  string username = 2;
  // Secret is the password or token, on one line. It is kept outside
  // every sandbox, and no call returns it.
  string secret = 3 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
}

// SetCredentialRequest is a credential to keep.
message SetCredentialRequest {
  // Credential is the credential.
  Credential credential = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetCredentialResponse is the credential as it is kept.
message SetCredentialResponse {
  // Credential is the credential, without its secret.
  Credential credential = 1;
}

// DescribeCredentialRequest names the host whose credential is asked
// after.
message DescribeCredentialRequest {
  // Host is the host, written as it was to SetCredential.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
}

// DescribeCredentialResponse is the caller's credential for the host.
message DescribeCredentialResponse {
  // Credential is the credential, without its secret.
  Credential credential = 1;
}

// ListCredentialsRequest asks for a page of the caller's credentials.
message ListCredentialsRequest {
  // Page_size is the most credentials to return; zero is a hundred, and more
  // than a thousand is a thousand.
  int32 page_size = 1;
  // Page_token is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 2;
}

// ListCredentialsResponse is a page of the caller's credentials.
message ListCredentialsResponse {
  // Credentials are the credentials, by host, without their secrets.
  repeated Credential credentials = 1;
  // Next_page_token asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// DeleteCredentialRequest names the host whose credential is let go of.
message DeleteCredentialRequest {
  // Host is the host, written as it was to SetCredential.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteCredentialResponse says nothing: the caller keeps none for the
// host.
message DeleteCredentialResponse {}
