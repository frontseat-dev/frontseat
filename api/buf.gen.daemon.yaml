# The plugin contract's Go, for the daemon alone: what a plugin is asked
# and answers crosses the Wasm boundary, never a network, so it has
# messages and no Connect, and no developer writes a plugin in Go. It is
# generated into the daemon's internal packages
# (server/internal/pluginapi); the types of the other modules it
# names are the Go SDK's. Generated, never edited, and held to what this
# writes now by `mise run check`. Frontseat builds it as
# //api:buf.generate/daemon, into the server, which says so in its
# catalog file (spec.frontseat.generated).
version: v2
# What it writes into is its own: emptied first, so that what a proto no
# longer gives is gone.
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/frontseat-dev/frontseat/sdk/go/api
    - path: frontseat/plugin
      file_option: go_package_prefix
      value: github.com/frontseat-dev/frontseat/server/internal/pluginapi
  disable:
    - path: google/api
      file_option: go_package_prefix
    - path: google/rpc
      file_option: go_package_prefix
plugins:
  - local: protoc-gen-go
    out: ../server/internal/pluginapi
    opt: paths=source_relative
inputs:
  - directory: .
    paths:
      - plugin-proto/frontseat
