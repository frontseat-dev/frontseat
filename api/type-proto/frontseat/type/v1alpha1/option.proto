// Typed plugin options shared by declarations, execution and graph views.
syntax = "proto3";

package frontseat.type.v1alpha1;

// OptionValue preserves an option's kind and exact value across every API.
// An unset value is invalid. An empty string or list, false and zero are values.
message OptionValue {
  // Value is exactly one supported kind; integers never pass through a float.
  oneof value {
    // String_value is text.
    string string_value = 1;
    // Bool_value is true or false.
    bool bool_value = 2;
    // Int_value is a signed 64-bit integer.
    int64 int_value = 3;
    // String_list_value is an ordered list of text; entries retain punctuation.
    StringList string_list_value = 4;
  }

  // StringList carries a list as one option value, including an empty list.
  message StringList {
    // Values are the entries, in their declared order.
    repeated string values = 1;
  }
}
