// frontseat.type.v1alpha1: the value of a plugin's option, as a plugin
// declares its default, as a project is built with it, and as the graph
// shows it.
syntax = "proto3";

package frontseat.type.v1alpha1;

// OptionValue is the value of one option, of one of four kinds. One of
// them is always set: an empty string, an empty list, false and zero are
// values, and a message with none set is refused.
message OptionValue {
  // Value is the value, of its kind. A whole number is an int_value,
  // exact over the whole of its 64 bits.
  oneof value {
    // `string_value` is text.
    string string_value = 1;
    // `bool_value` is true or false.
    bool bool_value = 2;
    // `int_value` is a signed 64-bit integer.
    int64 int_value = 3;
    // `string_list_value` is a list of text, in order; each entry is kept
    // exactly as it was written.
    StringList string_list_value = 4;
  }

  // StringList is a list of text as one value; it may be empty.
  message StringList {
    // Values are the entries, in their declared order.
    repeated string values = 1;
  }
}
