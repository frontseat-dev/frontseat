# The API this module's protobuf package defines. An API owns no source:
# the api component owns every project beneath api/. Its definition is
# the directory of the protobuf package, the unit Buf lints and generates.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sandbox-api
  namespace: frontseat
  description: "Sandboxes, for every sandbox there is, over a driver, over Connect"
spec:
  type: grpc
  lifecycle: experimental
  owner: jbadeau
  system: workspaces
  definition: frontseat/sandbox/v1alpha1
