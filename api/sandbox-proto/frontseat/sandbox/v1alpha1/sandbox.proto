// frontseat.sandbox.v1alpha1: sandboxes. A sandbox is an isolated machine:
// an image, what it may reach on the network, volumes, ports and further
// containers. A build daemon runs in one, and so does a test's database
// and an agent. It
// knows nothing of repositories or builds: a workspace, which lives in a
// sandbox, is frontseat.workspace.v1alpha1's. What a sandbox may reach is
// said in the network's own terms: hosts, the programs that may ask them,
// the requests let through, and a credential kept outside it.
//
// The service makes its sandboxes through a driver: the part of the
// server that talks to whatever provides them, such as a container
// runtime. A driver says what it can enforce, and a request for anything
// else is refused, never run weaker.
//
// It is not a public API. It is served to the server programs built on
// it, in its process or beside it, and to no one else: whoever may call
// it may run anything in any of its sandboxes. The control plane serves
// workspaces over it and serves none of it on its own endpoint.
//
// What it refuses by name carries ErrorInfo of the domain
// sandbox.frontseat.dev, with the reason each call names. One call at a
// time changes a sandbox: a call that stops waiting for another's to
// finish, because its caller went away or its deadline passed, is
// refused CANCELED or DEADLINE_EXCEEDED with the reason
// SANDBOX_BUSY. What a driver cannot enforce is refused UNIMPLEMENTED
// with the reason CAPABILITY_NOT_SERVED, the message naming it; what a
// driver finds not well formed, INVALID_ARGUMENT with SPEC_INVALID,
// before anything of a sandbox is made (CreateSandbox); and a sandbox
// that is ending, FAILED_PRECONDITION with SANDBOX_ENDING.
//
// Beside its calls the service carries bytes to a TCP port of a
// sandbox, as a WebSocket, at /sandboxes/{id}/tunnels/{port}. A refusal
// is answered in place of the WebSocket, as the Connect protocol writes
// a unary call's error: where no sandbox has that id, as DescribeSandbox
// refuses it, and FAILED_PRECONDITION with the reason PORT_UNREACHED
// where the port is not reached, as one nothing in the sandbox listens
// on, nothing more said of why.
syntax = "proto3";

package frontseat.sandbox.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// SandboxService is sandboxes: their lifecycle.
service SandboxService {
  // CreateSandbox checks a spec, records a sandbox of it and returns at
  // once, the sandbox STATE_STARTING, while its driver makes it apart
  // from the call: an image's pull among it, however long that takes and
  // whether or not the caller still waits. What the driver finds not
  // well formed is found before anything is made, and refused here: a
  // rule's host, program or request, a volume's path, and a credential a
  // rule attaches that is not kept, under the id it names, for the host
  // it names; and so is what it cannot give, as a directory of the image
  // written or of its host bound in where its runtime gives neither. It
  // is running when WaitSandbox ends with STATE_RUNNING. Where the
  // driver could not make it, as where its image could not be pulled,
  // its container could not be started or the command of
  // SandboxSpec.before_containers failed, it is STATE_FAILED, and
  // Sandbox.failure says why, to this server and to one made again over
  // its state; it is listed, with whatever the driver left of it, until
  // it is deleted. A server that stops while a sandbox is made, by its
  // end or a crash, leaves it STATE_STARTING, and one made again over
  // its state makes it, under the same id. Deleted while it is being
  // made, its making is stopped and it is STATE_ENDING, never failed:
  // where the DeleteSandbox gave up before it was gone, it is ending, or
  // gone, and a DeleteSandbox sent again removes it. Sent again with the
  // same request_id, it returns the sandbox the first call made, being
  // made or not, while that sandbox is there
  // (CreateSandboxRequest.request_id).
  //
  // ### Errors
  // - INVALID_ARGUMENT: the spec names no image, says no egress mode,
  //   holds something this server does not know, or holds what the
  //   driver finds not well formed (SPEC_INVALID); the request_id is
  //   longer than 128 bytes (REQUEST_ID_INVALID).
  // - UNIMPLEMENTED: the spec asks for what the driver cannot enforce
  //   or give; the message names it (CAPABILITY_NOT_SERVED).
  // - FAILED_PRECONDITION: the sandbox the same request_id made is
  //   ending; the request is sent again once it is gone (SANDBOX_ENDING).
  // - NOT_FOUND: the sandbox the same request_id made was gone before it
  //   could be described (SANDBOX_NOT_FOUND).
  // - UNAVAILABLE: the service is closing, and makes nothing more. No
  //   reason is given.
  // - INTERNAL: the driver could not check the spec, or the sandbox
  //   could not be recorded; nothing is made. No reason is given.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // DescribeSandbox returns one sandbox, as it is now.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND).
  rpc DescribeSandbox(DescribeSandboxRequest) returns (DescribeSandboxResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListSandboxes returns the sandboxes, oldest first, a page at a time.
  // A page token names a position in that list: where a sandbox is
  // deleted between two pages, the next page may leave one out.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteSandbox ends a sandbox and removes it. What was only in it is
  // lost. Only a sandbox this service made is its to delete. One being
  // made is made no further, and is ending from here, though this call
  // gives up before it is gone (SANDBOX_BUSY): sent again, it removes it.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND).
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PauseSandbox stops a sandbox and keeps what its driver can: its disk,
  // and its memory where the driver snapshots machines.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND).
  // - UNIMPLEMENTED: the driver cannot pause (CAPABILITY_NOT_SERVED).
  // - FAILED_PRECONDITION: the driver could not make the sandbox; it is
  //   deleted, and asked for anew (SANDBOX_FAILED). It is ending, as one
  //   deleted while it was made is (SANDBOX_ENDING).
  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ResumeSandbox starts a paused sandbox again.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND).
  // - FAILED_PRECONDITION: the driver could not make the sandbox; it is
  //   deleted, and asked for anew (SANDBOX_FAILED). It is ending, as one
  //   deleted while it was made is (SANDBOX_ENDING).
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // WaitSandbox returns the sandbox once it is no longer starting:
  // running, paused, failed or ending. It is cheap to call again.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND).
  rpc WaitSandbox(WaitSandboxRequest) returns (WaitSandboxResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ExecSandbox runs a command in one of a running sandbox's containers,
  // as its image's user, and returns how it exited and what it printed,
  // stdout and stderr as written. It is how a caller asks a sandbox's
  // service whether it is ready, and has it set itself up.
  //
  // ### Errors
  // - NOT_FOUND: no sandbox has that id (SANDBOX_NOT_FOUND), or it has
  //   no container of that name (CONTAINER_NOT_FOUND).
  // - INVALID_ARGUMENT: no command is given (COMMAND_MISSING), or the
  //   timeout is zero, negative or more than ten minutes
  //   (TIMEOUT_INVALID).
  // - FAILED_PRECONDITION: the sandbox is not running
  //   (SANDBOX_NOT_RUNNING).
  // - UNIMPLEMENTED: the driver runs no command in a sandbox
  //   (CAPABILITY_NOT_SERVED).
  // - DEADLINE_EXCEEDED: the command ran past its timeout, and was ended
  //   (COMMAND_TIMED_OUT).
  rpc ExecSandbox(ExecSandboxRequest) returns (ExecSandboxResponse);

  // SetCredential gives the server a credential for a host, under a name
  // the caller chooses. The server keeps it outside every sandbox. A
  // sandbox whose egress rule for that host names the credential has it
  // added to the requests that rule lets through, and never holds it
  // itself. Whoever may create a sandbox can therefore have it send the
  // host anything the credential allows, a push included. Setting a
  // credential under a name that is taken replaces the one kept, which
  // must be for the same host. The secret is never returned.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the name is not a valid credential name, as
  //   Credential.name says (CREDENTIAL_NAME_INVALID); the host is
  //   missing or is not a host name (CREDENTIAL_HOST_INVALID); the
  //   username is not one, as Credential.username says
  //   (CREDENTIAL_USERNAME_INVALID); no secret is given, or one that is
  //   not as Credential.secret says (CREDENTIAL_SECRET_INVALID).
  // - ALREADY_EXISTS: the name is kept for another host
  //   (CREDENTIAL_NAME_TAKEN).
  // - UNIMPLEMENTED: the driver keeps no credential outside its
  //   sandboxes (CAPABILITY_NOT_SERVED).
  // - UNAVAILABLE: the driver could not keep it. No reason is given.
  rpc SetCredential(SetCredentialRequest) returns (SetCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // DescribeCredential returns the credential the server keeps under a
  // name: its host, its username, and the environment variable in which
  // a sandbox that uses it finds its stand-in. It never returns the
  // secret.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the name is not a valid credential name
  //   (CREDENTIAL_NAME_INVALID).
  // - NOT_FOUND: no credential is kept under the name
  //   (CREDENTIAL_NOT_FOUND).
  // - UNIMPLEMENTED: the driver keeps no credential outside its
  //   sandboxes (CAPABILITY_NOT_SERVED).
  rpc DescribeCredential(DescribeCredentialRequest) returns (DescribeCredentialResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteCredential removes the credential kept under a name. A
  // sandbox created afterwards with a rule that names it is refused.
  // Deleting a name under which nothing is kept succeeds.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the name is not a valid credential name
  //   (CREDENTIAL_NAME_INVALID).
  // - UNIMPLEMENTED: the driver keeps no credential outside its
  //   sandboxes (CAPABILITY_NOT_SERVED).
  // - FAILED_PRECONDITION: a sandbox that is there has a rule that
  //   names the credential (CREDENTIAL_IN_USE).
  // - UNAVAILABLE: the driver could not remove it. No reason is given.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Sandbox is an isolated machine.
message Sandbox {
  // Id is the sandbox's id, "sbx_" and what the server chose.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Spec is what was asked for.
  SandboxSpec spec = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // State is where it is.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Driver is the driver that made it.
  string driver = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Endpoints are how its ports are reached.
  repeated Endpoint endpoints = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `create_time` is when it was made.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Failure says, for a sandbox that failed, what its driver said of
  // why; empty where it said nothing.
  string failure = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is where a sandbox is.
  enum State {
    // STATE_UNSPECIFIED: not known.
    STATE_UNSPECIFIED = 0;
    // STATE_STARTING: it was asked for and is not yet running.
    STATE_STARTING = 1;
    // STATE_RUNNING: it runs and its agent answers.
    STATE_RUNNING = 2;
    // STATE_PAUSED: it is stopped, and what its driver keeps is kept.
    STATE_PAUSED = 3;
    // STATE_FAILED: it could not start, or ended on its own; failure
    // says why.
    STATE_FAILED = 4;
    // STATE_ENDING: it was deleted, and its provider has not finished
    // removing it. Until it is gone, the only call it takes is
    // DeleteSandbox, again.
    STATE_ENDING = 5;
  }
}

// SandboxSpec is what a sandbox is asked to be.
message SandboxSpec {
  // Image is the image it runs, pinned by digest where the caller can.
  string image = 1 [(google.api.field_behavior) = REQUIRED];
  // Arguments replace the image's command; empty for the image's own.
  repeated string arguments = 2;
  // Wrapper is a command its first process is run through: what runs is
  // the wrapper, then the image's entrypoint and the arguments (or the
  // image's own command), as one command line, as `tini --` is run before
  // a command. Empty for none.
  repeated string wrapper = 3;
  // `user_id` is the user its first process runs as, by number; zero
  // for its image's own. No sandbox is asked to run as root.
  uint32 user_id = 4;
  // Writable are the directories of its image it may write, each an
  // absolute path, beside its own temporary directory and what is
  // mounted in it. Under a driver that does not restrict what a sandbox
  // writes, they change nothing: the sandbox may write them as it may
  // write the rest of its image.
  repeated string writable = 5;
  // Environment is the environment its first process starts with.
  map<string, string> environment = 6;
  // Egress is what it may reach: every sandbox says.
  Egress egress = 7 [(google.api.field_behavior) = REQUIRED];
  // Ports are the ports of it to make reachable.
  repeated int32 ports = 8;
  // Volumes are the volumes mounted in it.
  repeated Volume volumes = 9;
  // Labels are for finding it.
  map<string, string> labels = 10;
  // Containers are its further containers, each with an image of its
  // own, started after its first and before it is running, and ended
  // with it. They share its network: its loopback, and with
  // Egress.MODE_BLOCK nothing more, which is how a test reaches its
  // services and nothing else.
  repeated Container containers = 11;
  // `before_containers` is a command run in its first container before
  // any further container starts, as when the first has something to
  // set up that the others need. It is given only with further
  // containers. Where the command fails, the sandbox has failed
  // (STATE_FAILED), saying why, and is deleted with whatever the driver
  // left of it. A driver that cannot run it refuses the sandbox, and
  // makes nothing.
  StartupGate before_containers = 12;
}

// StartupGate is a command a sandbox's first container runs before its
// further containers start.
message StartupGate {
  // Arguments are the program and its arguments, each its own string:
  // no shell reads them. A gate with none is refused.
  repeated string arguments = 1 [(google.api.field_behavior) = REQUIRED];
  // Timeout is how long the command is given: more than zero, and at
  // most two minutes. A gate with none is refused. The command has
  // failed where it does not exit 0 within it.
  google.protobuf.Duration timeout = 2 [(google.api.field_behavior) = REQUIRED];
}

// Container is one of a sandbox's further containers.
message Container {
  // Name names it within the sandbox: lower-case letters, digits and
  // dashes, and not "main", which is the sandbox's first.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Image is the image it runs, pinned by digest where the caller can.
  string image = 2 [(google.api.field_behavior) = REQUIRED];
  // Arguments replace the image's command; empty for the image's own.
  repeated string arguments = 3;
  // Environment is the environment its first process starts with.
  map<string, string> environment = 4;
  // Volumes are the volumes mounted in it.
  repeated Volume volumes = 5;
}

// Egress is what a sandbox may reach.
message Egress {
  // Mode is the rule.
  Mode mode = 1 [(google.api.field_behavior) = REQUIRED];
  // Rules are the hosts it may reach under MODE_ALLOW_LISTED, each with
  // its limits: which programs may reach the host, which requests are
  // let through, and which kept credential is added to them. At most one
  // rule names a host. With MODE_ALLOW_ALL and MODE_BLOCK there are
  // none. A driver that cannot limit a rule to its programs or its
  // requests, or that keeps no credential, refuses a rule that asks for
  // that (CAPABILITY_NOT_SERVED).
  repeated EgressRule rules = 2;

  // Mode is the rule for what a sandbox may reach.
  enum Mode {
    // MODE_UNSPECIFIED: not said. A sandbox is refused without a mode
    // (SPEC_INVALID).
    MODE_UNSPECIFIED = 0;
    // MODE_ALLOW_ALL: anything. A driver that lets a sandbox reach only
    // hosts that are named refuses it.
    MODE_ALLOW_ALL = 1;
    // MODE_ALLOW_LISTED: only what its rules name.
    MODE_ALLOW_LISTED = 2;
    // MODE_BLOCK: nothing.
    MODE_BLOCK = 3;
  }
}

// EgressRule is one host a sandbox may reach, and how far.
message EgressRule {
  // Host is the host: a name, or a name and a port as name:port; without
  // a port, 443, and reached over https. Written with "http://" before
  // it, and then port 80 where none is given, it is reached over http.
  // It is a name and never an address.
  string host = 1 [(google.api.field_behavior) = REQUIRED];
  // Programs are the programs the rule is for, each by its whole path,
  // and what one of them starts; empty for any program of the sandbox.
  repeated string programs = 2;
  // Requests are the requests let through, and no others; empty for
  // anything asked of the host.
  repeated EgressRequest requests = 3;
  // Credential names a credential the server keeps for the host
  // (SetCredential), which is added to the requests the rule lets
  // through. The sandbox never holds the secret: it sends a stand-in,
  // which it finds in the environment variable DescribeCredential names,
  // and the stand-in is replaced by the secret on the way out. Empty for
  // none. Where nothing is kept under the name, or what is kept is for
  // another host, the sandbox is refused.
  string credential = 4;
}

// EgressRequest is one request a rule lets through.
message EgressRequest {
  // Method is the HTTP method, in capitals.
  string method = 1 [(google.api.field_behavior) = REQUIRED];
  // Path is the request's whole path, written plainly. A segment of it
  // other than the first may be "*", which stands for exactly one
  // segment of any text: for an id the host assigns, such as a release's
  // number, which is not known when the rule is written. No other
  // pattern is taken.
  string path = 2 [(google.api.field_behavior) = REQUIRED];
  // Query are the query parameters a request must carry, each with the
  // one value it must have. Empty, the request's query is not checked.
  map<string, string> query = 3;
}

// Volume is a volume mounted in a sandbox.
message Volume {
  // Name names it within the sandbox.
  string name = 1;
  // Path is where it is mounted.
  string path = 2;
  // Kind is what becomes of it.
  Kind kind = 3;
  // Source is, for a volume of KIND_HOST, the directory it is: a path on
  // the provider's host.
  string source = 4;
  // `read_only` is whether the sandbox may only read it.
  bool read_only = 5;
  // Subpath is the one directory of a host volume that is
  // mounted, relative to its root, never leaving it: what is beside it
  // is not seen. Empty, the whole volume is mounted. A driver that cannot
  // mount a subpath refuses it.
  string subpath = 6;

  // Kind is what becomes of a volume.
  enum Kind {
    // KIND_UNSPECIFIED: not said; the volume is treated as
    // KIND_EPHEMERAL.
    KIND_UNSPECIFIED = 0;
    // KIND_EPHEMERAL: it goes with the sandbox.
    KIND_EPHEMERAL = 1;
    // KIND_HOST: a directory of the provider's host, such as a
    // developer's checkout on their own machine.
    KIND_HOST = 2;
  }
}

// Endpoint is how one port of a sandbox is reached.
message Endpoint {
  // Port is the port inside the sandbox.
  int32 port = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Uri is where it is reached from outside.
  string uri = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreateSandboxRequest makes a sandbox.
message CreateSandboxRequest {
  // Spec is what to make.
  SandboxSpec spec = 1 [(google.api.field_behavior) = REQUIRED];
  // `request_id` makes a retry return the sandbox the first call made: a
  // client that lost the answer sends the same request again with it.
  // It is at most 128 bytes; a UUID serves. It is remembered for as long
  // as that sandbox is there. What is sent with it again is not compared
  // with the first request. Empty, every call makes a sandbox.
  string request_id = 2;
}

// CreateSandboxResponse is the sandbox that was made.
message CreateSandboxResponse {
  // Sandbox is the sandbox.
  Sandbox sandbox = 1;
}

// DescribeSandboxRequest names a sandbox.
message DescribeSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DescribeSandboxResponse is one sandbox.
message DescribeSandboxResponse {
  // Sandbox is the sandbox.
  Sandbox sandbox = 1;
}

// ListSandboxesRequest says which sandboxes to keep.
message ListSandboxesRequest {
  // Labels keeps the sandboxes that carry every label it gives, each
  // with its value. Empty keeps all.
  map<string, string> labels = 1;
  // `page_size` is the most sandboxes to return; zero is a hundred,
  // and more than a thousand is a thousand.
  int32 page_size = 2;
  // `page_token` is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 3;
}

// ListSandboxesResponse is a page of the sandboxes kept.
message ListSandboxesResponse {
  // Sandboxes are the sandboxes, oldest first.
  repeated Sandbox sandboxes = 1;
  // `next_page_token` asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// DeleteSandboxRequest names a sandbox to end.
message DeleteSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteSandboxResponse is empty: the sandbox is gone.
message DeleteSandboxResponse {}

// PauseSandboxRequest names a sandbox to pause.
message PauseSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// PauseSandboxResponse is the sandbox as it pauses.
message PauseSandboxResponse {
  // Sandbox is the sandbox.
  Sandbox sandbox = 1;
}

// ResumeSandboxRequest names a sandbox to resume.
message ResumeSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ResumeSandboxResponse is the sandbox as it resumes.
message ResumeSandboxResponse {
  // Sandbox is the sandbox.
  Sandbox sandbox = 1;
}

// WaitSandboxRequest names a sandbox to wait for.
message WaitSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// WaitSandboxResponse is the sandbox as the wait ended on it.
message WaitSandboxResponse {
  // Sandbox is the sandbox.
  Sandbox sandbox = 1;
}

// ExecSandboxRequest is a command to run in a sandbox's container.
message ExecSandboxRequest {
  // `sandbox_id` is the sandbox's id.
  string sandbox_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Container is the container's name; "main" or empty for the
  // sandbox's first.
  string container = 2;
  // Arguments are the program and its arguments.
  repeated string arguments = 3 [(google.api.field_behavior) = REQUIRED];
  // Timeout is how long the command may run: past it, the command is
  // ended and the call is refused. Unset, it is a minute; it is at most
  // ten minutes.
  google.protobuf.Duration timeout = 4;
}

// ExecSandboxResponse is how the command ended.
message ExecSandboxResponse {
  // `exit_code` is its exit status.
  int32 exit_code = 1;
  // Output is what it printed, stdout and stderr as written: the first
  // 1 MiB of it.
  bytes output = 2;
  // `output_truncated` is whether it printed more than output holds.
  bool output_truncated = 3;
}

// Credential is a secret for one host, kept by the server outside every
// sandbox under a name of its caller's choosing.
message Credential {
  // Name is the name it is kept under, of the caller's choosing:
  // lower-case letters, digits and dashes, at most 63, beginning with a
  // letter or a digit.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Host is the host it is for: a name, or a name and a port as
  // name:port. Without a port it is port 443, and the credential is for
  // requests to the host over https. Written with "http://" before it,
  // and then port 80 where none is given, it is for requests over http,
  // and not for requests to the same host over https. The server returns
  // it as name:port, with "http://" before it for http.
  //
  // A credential for http is sent unencrypted. One for https may be too:
  // where the driver's runtime cannot require TLS, a program in a
  // sandbox that uses the credential can have it sent to the host
  // without TLS.
  string host = 2 [(google.api.field_behavior) = REQUIRED];
  // Username is the user it is for, as the host knows them: at most
  // 128 letters, digits, dots, underscores, hyphens and at signs. It is
  // not secret: a sandbox that uses the credential is told it.
  string username = 3;
  // Secret is the password or token: one line, of at most 4096 bytes.
  // It is kept outside every sandbox, and no call returns it.
  string secret = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  // Variable is the environment variable in which a sandbox that uses
  // the credential finds its stand-in.
  string variable = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SetCredentialRequest is a credential to keep.
message SetCredentialRequest {
  // Credential is the credential.
  Credential credential = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetCredentialResponse is the credential as it is kept.
message SetCredentialResponse {
  // Credential is the credential, without its secret.
  Credential credential = 1;
}

// DeleteCredentialRequest names the credential to remove.
message DeleteCredentialRequest {
  // Name is the name it was kept under.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteCredentialResponse is empty: the server keeps no credential
// under the name.
message DeleteCredentialResponse {}

// DescribeCredentialRequest names a credential.
message DescribeCredentialRequest {
  // Name is the name it was kept under.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// DescribeCredentialResponse is what is said of a credential that is
// kept: never its secret.
message DescribeCredentialResponse {
  // Credential is the credential, without its secret.
  Credential credential = 1;
}
