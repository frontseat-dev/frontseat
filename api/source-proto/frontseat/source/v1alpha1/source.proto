// frontseat.source.v1alpha1: the source a workspace's supervisor holds,
// as the control plane tells it. The control plane keeps what a
// workspace is asked for and is the one writer of it: it gives the
// supervisor the whole source to hold, at a generation, and reads back
// what the supervisor holds; the supervisor keeps no spec of its own. A
// supervisor holds one source, and so a source has no name.
//
// It is the supervisor's internal API, not a public one. It is served on a
// port of its own. The control plane calls it,
// and forwards no caller's request to it. No client, SDK or command
// line calls it, and its Go is the server's alone
// (common/told/sourceapi). The port is not a security boundary
// inside the supervisor's sandbox, where any program may reach it. What
// protects a workspace is that the control plane never takes what a
// workspace is asked for from the supervisor: it keeps that itself, and
// where a supervisor holds another generation than the control plane's, it
// tells the supervisor its own again.
//
// What it refuses by name carries ErrorInfo of the domain
// source.frontseat.dev, whose reason the control plane acts on.
syntax = "proto3";

package frontseat.source.v1alpha1;

import "frontseat/type/v1alpha1/types.proto";
import "google/api/field_behavior.proto";

// SourceService is the source a supervisor holds.
service SourceService {
  // SetSource gives the supervisor the whole source to hold, at a
  // generation, and returns once the supervisor has begun cloning it:
  // WaitSource says how that ended. What the supervisor holds already stays;
  // nothing is removed. The supervisor accepts any generation the control
  // plane gives, the one it holds included, and holds that generation
  // from then on.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the generation is less than one
  //   (GENERATION_INVALID); the spec names no repository, cloned or
  //   stored (SOURCE_MISSING); a repository it names, or the place it
  //   gives for an entity, cannot be held in the directory where the
  //   supervisor holds its source (SOURCE_UNFIT).
  // - FAILED_PRECONDITION: the supervisor is still cloning what it was told
  //   before, and is to be told again once it is done
  //   (SOURCE_POPULATING); the supervisor was started over a directory it
  //   was given, and clones nothing (SOURCE_MOUNTED).
  rpc SetSource(SetSourceRequest) returns (SetSourceResponse);

  // WaitSource returns the source once the supervisor has finished cloning:
  // what it holds, the generation it last accepted, and how cloning
  // that ended. It returns at once where the generation the supervisor
  // holds is not the one the request names, as with a supervisor that was
  // started again after it was told: the caller, who names the
  // generation it last gave, sees from the answer whether the supervisor
  // holds it. A caller with a deadline is answered before the deadline,
  // with the source still STATE_POPULATING where it is, so that a
  // deadline that does pass means the supervisor is not answering.
  //
  // ### Errors
  // It refuses nothing by name.
  rpc WaitSource(WaitSourceRequest) returns (WaitSourceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Source is what a supervisor holds, and how cloning it went.
message Source {
  // State is how far cloning it is.
  State state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Failure says why cloning it failed; empty where it did not.
  string failure = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Generation is the generation it last accepted; zero for a supervisor
  // that was told none since it started.
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Repositories are the repositories it holds.
  repeated Repository repositories = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is how far cloning a source is.
  enum State {
    // STATE_UNSPECIFIED: not known.
    STATE_UNSPECIFIED = 0;
    // STATE_POPULATING: it is cloning what it was told.
    STATE_POPULATING = 1;
    // STATE_READY: it holds what it was told, or was told nothing.
    STATE_READY = 2;
    // STATE_FAILED: cloning what it was told failed; failure says why.
    // What it cloned by then is held.
    STATE_FAILED = 3;
  }
}

// SourceSpec is the whole source a supervisor is to hold.
message SourceSpec {
  // Generation numbers the specs the control plane has given, from
  // one: it gives the same spec with the same generation, and a changed
  // spec with a higher one.
  int64 generation = 1 [(google.api.field_behavior) = REQUIRED];
  // Repositories are repositories to clone: those a workspace was asked
  // for, and those the control plane resolved its entities to.
  repeated RepositorySource repositories = 2;
  // Entities are the entities the control plane resolved, and where each
  // is among the repositories. The supervisor resolves nothing itself: this
  // is all it knows of which entity is where.
  repeated LocatedEntity entities = 3;
  // Stored are the repositories the workspace holds from the control
  // plane's snapshot store, each mounted in the sandbox at its
  // directory before the supervisor was started: the supervisor clones
  // none of them, is given no credential of the store, and says it
  // holds each as it is told it here.
  repeated StoredSource stored = 4;
}

// StoredSource is a repository of the snapshot store that is mounted in
// the sandbox, at the changeset the control plane says.
message StoredSource {
  // Name is the supervisor's name for it: the one directory of the
  // workspace it is mounted at.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Repository is the store's name for it.
  string repository = 2 [(google.api.field_behavior) = REQUIRED];
  // Changeset is the id of the changeset it is mounted at.
  string changeset = 3 [(google.api.field_behavior) = REQUIRED];
  // Roots are the directories taken of it; empty for all of it.
  repeated string roots = 4;
}

// LocatedEntity is an entity, and where its source is.
message LocatedEntity {
  // Ref names the entity in full.
  frontseat.type.v1alpha1.EntityRef ref = 1 [(google.api.field_behavior) = REQUIRED];
  // Repository is the name of the repository that holds it, as a
  // RepositorySource names it.
  string repository = 2 [(google.api.field_behavior) = REQUIRED];
  // Root is its directory in that repository; empty for all of it.
  string root = 3;
}

// RepositorySource is a repository for the supervisor to clone.
message RepositorySource {
  // Remote is its URL.
  string remote = 1 [(google.api.field_behavior) = REQUIRED];
  // Ref is the branch, tag or commit to stand at; empty for the remote's
  // default branch.
  string ref = 2;
  // Roots are the directories to take of it; empty for all of it.
  repeated string roots = 3;
  // Name is the supervisor's name for it: the one directory it is cloned
  // into.
  string name = 4 [(google.api.field_behavior) = REQUIRED];
}

// Repository is one repository a supervisor holds.
message Repository {
  // Name is its name: what a label and a path name it by. Empty for a
  // directory the supervisor was started over and did not clone.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Remote is where it was cloned from; empty for a stored repository.
  string remote = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Commit is the commit it stands at; for a stored repository, the
  // changeset it was told.
  string commit = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Roots are the directories taken of it; empty for all of it.
  repeated string roots = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Stored is the snapshot store's name for it, where it is mounted and
  // was not cloned; empty for one that was cloned.
  string stored = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SetSourceRequest gives a supervisor the source to hold.
message SetSourceRequest {
  // Spec is the whole source, at its generation.
  SourceSpec spec = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetSourceResponse is the source as the request left it.
message SetSourceResponse {
  // Source is the source, being cloned.
  Source source = 1;
}

// WaitSourceRequest names the generation the caller waits for.
message WaitSourceRequest {
  // Generation is the generation the caller last gave.
  int64 generation = 1 [(google.api.field_behavior) = REQUIRED];
}

// WaitSourceResponse is the source as the wait ended on it.
message WaitSourceResponse {
  // Source is the source.
  Source source = 1;
}
