// frontseat.plugin.v1alpha1: what a plugin is asked and what it answers.
//
// A plugin is a wasm module. It reads the repository only through the host
// (host.proto), so the host sees every read; the same reads and the same
// request give the same answer. It runs nothing: it declares actions, and
// the host runs them on the grid.
//
// This file, host.proto, release.proto, abi.proto and the ABI document
// beside them (ABI.md) are the whole contract. A plugin in any language
// that compiles to wasm needs nothing else, and an SDK is a convenience
// over the types generated from these files.
//
// A plugin says what it is (Describe), and serves what of the rest it is
// for: it finds projects and declares their actions (Analyze), tells its
// tool what they were handed (Arrange) and says what a check of its found
// (Report); it finds catalog entities (Analyze) and says what their files
// should say (Reconcile); it says how a service is started for a test
// (Service); it is a release strategy (Branch, Version). Every plugin
// serves Describe, Analyze and Arrange. A method it does not serve it
// answers UNIMPLEMENTED, for the method's own reason: REPORT_NOT_SERVED,
// RECONCILE_NOT_SERVED and SERVICE_NOT_SERVED, the method's name in
// capitals; BRANCHING_STRATEGY_NOT_SERVED and
// VERSIONING_STRATEGY_NOT_SERVED, the kind of strategy, which is also
// the answer for a strategy, or a service, it does not claim. A name here
// is lower-case words of [a-z0-9] joined by single hyphens.
syntax = "proto3";

package frontseat.plugin.v1alpha1;

import "frontseat/plugin/v1alpha1/release.proto";
import "frontseat/type/v1alpha1/diagnostic.proto";
import "frontseat/type/v1alpha1/option.proto";
import "frontseat/type/v1alpha1/service.proto";
import "frontseat/type/v1alpha1/types.proto";

// PluginService is what the host asks of a plugin. It is carried by the
// call ABI (abi.proto), not by a network: one call in, one answer out.
service PluginService {
  // Describe says what the plugin is. It is called once when the module
  // is loaded, takes nothing of the repository, and must not read through
  // the host.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Analyze finds the projects under the roots it is given and declares
  // their actions. It answers for each root separately.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // Arrange says what a project's tool must be told of what the project
  // was handed. A plugin finds a project knowing only its own files; the
  // host then finds which projects of the workspace provide what it
  // requires, and hands them over. Where the tool has to be told they
  // are there, in a file of its own (a Go workspace, a Maven settings
  // file), the plugin writes that file here. It is asked only of
  // actions that were handed something.
  rpc Arrange(ArrangeRequest) returns (ArrangeResponse);

  // Report says what a check found, from what it printed: findings a
  // client need not parse. It is asked of each check that ran, once it
  // has ended, whatever its exit code. A plugin that does not serve it
  // answers UNIMPLEMENTED for the reason REPORT_NOT_SERVED, and its
  // checks have no findings but their exit code and what they printed.
  // UNIMPLEMENTED for another reason is a failure of the call.
  rpc Report(ReportRequest) returns (ReportResponse);
  // Reconcile asks a plugin that finds catalog entities what their
  // files should say of what the source says: for each entity, the
  // components it depends on and that depend on it, as the host
  // inferred them. The plugin owns its catalog's schema, which field
  // holds the list, how a reference is spelled and which document of a
  // file is which entity, and answers with edits; the host owns the
  // write, which keeps the file's comments and other fields, and
  // refuses an edit after which the plugin's own reading of the file
  // disagrees with the source. The host asks only for a file out of step.
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);

  // Service says how a service is started for a test: what runs, the
  // ports it serves, when it is ready, where a test reaches it and what
  // a test given it is told. It is asked of the plugin that claims the
  // name an entity's service says it is (DescribeResponse.services),
  // with what the entity's file wrote beside that name, and answers the
  // whole of it. It reads nothing through the host: what it is told is
  // all it knows, so the same question has the same answer, and the
  // host keeps it.
  rpc Service(ServiceRequest) returns (ServiceResponse);

  // Branch says what a branch releases of a unit, for a plugin that is
  // a branching strategy (release.proto). It reads nothing through the
  // host.
  rpc Branch(BranchRequest) returns (BranchResponse);

  // Version says a unit's next version and why, for a plugin that is a
  // versioning strategy. It reads nothing through the host.
  rpc Version(VersionRequest) returns (VersionResponse);
}

// Context is what every call but Describe carries of the repository. The
// files themselves are read through the host.
message Context {
  // Options are the options the plugin declared, each with the value that
  // holds where the plugin is asked: what the nearest entity or the
  // repository set, or the option's own default.
  map<string, frontseat.type.v1alpha1.OptionValue> options = 1;
  // Tools are the versions the repository pins, by tool: "go".
  map<string, string> tools = 2;
  // Profile is the way the source is to be built. A plugin declares the
  // commands of that way: its compiler flags and its tools' own switches.
  // It is never unspecified.
  frontseat.type.v1alpha1.Profile profile = 7;
  // Platforms are the platforms what the plugin is asked about is
  // shipped for, as its entity says (spec.frontseat.platforms), each an
  // operating system and an architecture as "linux/amd64": what a
  // project's package actions are made for. None, where its entity says
  // none; a plugin whose tool makes what is the same on every platform
  // makes nothing of them.
  repeated string platforms = 8;
}

// Option is an option a plugin takes: something a repository, or an
// entity, may set of how the plugin builds. The host checks what is set
// against it, and hands the plugin every option it declared, each with
// the value that holds where the plugin is asked.
message Option {
  // Name is what it is set by, lower-case words of [a-z0-9] joined by
  // single hyphens.
  string name = 1;
  // Kind is the kind of value it takes.
  Kind kind = 3;
  // Default is its value where nothing sets it.
  frontseat.type.v1alpha1.OptionValue default = 4;
  // Entity_settable says a Component may set it, for its own directory and
  // beneath; unset, only a repository may.
  bool entity_settable = 5;

  // Kind is a kind of value an option takes.
  enum Kind {
    // KIND_UNSPECIFIED: not said; such an option is refused.
    KIND_UNSPECIFIED = 0;
    // KIND_STRING: text.
    KIND_STRING = 1;
    // KIND_BOOL: true or false.
    KIND_BOOL = 2;
    // KIND_INT: a signed 64-bit integer.
    KIND_INT = 3;
    // KIND_STRING_LIST: a list of text. A setting replaces the whole list.
    KIND_STRING_LIST = 4;
  }
}

// DescribeRequest asks a plugin what it is. The ABI a module speaks is
// said once, by its export frontseat_abi (ABI.md), which the host reads
// before it asks this.
message DescribeRequest {}

// DescribeResponse is what a plugin is.
message DescribeResponse {
  // Name is the plugin's name, lower-case words of [a-z0-9] joined by
  // single hyphens. It qualifies every action the plugin declares.
  string name = 1;
  // Interests are patterns of the files it reads, relative to a
  // repository, in the pattern language host.proto says. The host calls
  // Analyze only for a directory that holds a file they select.
  repeated string interests = 5;
  // Options are the options it takes. A repository or an entity can set
  // these and no others.
  repeated Option options = 6;
  // Generates_sources says Analyze declares generated source regions from
  // committed manifests. The host asks these plugins before other plugins and
  // refuses discovery that reads any generated region. No action runs during
  // analysis; generated files cannot supply analysis metadata.
  bool generates_sources = 7;
  // Release is what it serves of releasing; unset, nothing.
  ReleaseRoles release = 8;
  // Services are the names it answers Service for, as an entity's
  // service names what it is, lower-case [a-z0-9-]: "postgres". The
  // host refuses a name two plugins of a repository claim.
  repeated string services = 9;
}

// ServiceRequest asks how a service of a name the plugin claims is
// started.
message ServiceRequest {
  // Name is what the entity's service says it is: one of the names the
  // plugin claims.
  string name = 1;
  // Written is what the entity's file says beside that name: every
  // field it sets is one a person wrote, and the answer has each as it
  // was written, whole. A field left empty is the plugin's to say: the
  // host refuses a key written to say nothing, so none is set that a
  // person did not write.
  frontseat.type.v1alpha1.Service written = 2;
}

// ServiceResponse is how the service is started.
message ServiceResponse {
  // Service is the whole of it. The host holds it to what a service is:
  // an image named with its registry and digest, a port for each name,
  // readiness and endpoints that name ports it serves, and what was
  // written, kept.
  frontseat.type.v1alpha1.Service service = 1;
}

// AnalyzeRequest asks for the projects under some directories.
message AnalyzeRequest {
  // Context is the repository.
  Context context = 1;
  // Roots are the directories to analyze, relative to the repository:
  // each one where a file matches the plugin's interests. Empty is the
  // repository's root.
  repeated string roots = 2;
}

// AnalyzeResponse is what a plugin found, root by root.
message AnalyzeResponse {
  // Analyses are the answers, one for each root asked about.
  repeated Analysis analyses = 1;
}

// Analysis is what a plugin found under one root.
message Analysis {
  // Root is the directory this answers for.
  string root = 1;
  // Projects are the projects found.
  repeated Project projects = 2;
  // Entities are catalog descriptors, independent of build projects.
  repeated Entity entities = 3;
}

// Entity is a catalog descriptor read by a plugin.
message Entity {
  // Ref is its canonical, fully qualified identity; all parts are lower-case.
  frontseat.type.v1alpha1.EntityRef ref = 1;
  // Manifest is the repository-relative source file beneath the analyzed root.
  string manifest = 2;
  // Roots are directories this entity governs, beneath the analyzed root.
  // Organizational entities normally govern no source directory.
  repeated string roots = 3;
  // Relations are outgoing catalog facts. The host also emits their inverses.
  // Component-to-component dependsOn/dependencyOf facts are replaced by source
  // inference and cannot supply project or action dependencies.
  repeated EntityRelation relations = 4;
}

// EntityRelation relates a descriptor to another catalog identity.
message EntityRelation {
  // Type is the relation name, such as ownedBy or partOf.
  string type = 1;
  // Target is fully qualified, including when absent from the workspace.
  frontseat.type.v1alpha1.EntityRef target = 2;
  // Inverse_type is the corresponding name on the target, such as ownerOf.
  string inverse_type = 3;
}

// ArrangeRequest says what some actions of a project were handed.
message ArrangeRequest {
  // Context is the repository.
  Context context = 1;
  // Root is the project's directory, relative to the repository.
  string root = 2;
  // Actions are the names of the project's actions that were handed
  // this: the ones the answer is for.
  repeated string actions = 3;
  // Handed is what they were handed, in the order it was found: what the
  // project requires first, then what that requires.
  repeated Handed handed = 4;
}

// Handed is something a project was handed.
message Handed {
  // Coordinate is what it is required by.
  Coordinate coordinate = 1;
  // Into is the directory it was placed in, relative to the project.
  // It leads above the project ("../greet") where the action asked for
  // "{root}".
  string into = 2;
}

// ArrangeResponse is the files the tool needs.
message ArrangeResponse {
  // Files are written into the root of each action the request named.
  // An action that was not handed these does not see them.
  repeated File files = 1;
}

// Project is something to build: a Go module, a Maven module, a package of
// a JavaScript workspace.
message Project {
  // Root is its directory, relative to the repository.
  string root = 1;
  // Kind is what it is in its ecosystem, e.g. "go-module": a name, of at
  // most 256 bytes.
  string kind = 2;
  // Name is its name in its ecosystem: one line of printable text, of at
  // most 256 bytes, never empty, at the repository's root too.
  string name = 3;
  // Manifest is the file it was found from, relative to the repository.
  string manifest = 4;
  // Provides are the coordinates it can be required by, each with what
  // a project that requires it is handed.
  repeated Provide provides = 5;
  // Requires are what it needs of other projects and of the world.
  repeated Requirement requires = 6;
  // Actions are its actions.
  repeated Action actions = 7;
  // Input_sets are inputs declared once, by name, for the actions that
  // name them.
  repeated InputSet input_sets = 8;
  // Generated_sources contributes declared action outputs to the source of
  // existing projects: each to a directory at or beneath a project's root.
  // It does not claim that project's coordinate.
  repeated GeneratedSource generated_sources = 9;
  // Workspace_files are files above the project, relative to the
  // repository, that the ecosystem's tool reads for every project of
  // the workspace they belong to: a lock, a manifest the projects
  // inherit from, the tool's own configuration. Each is a literal path
  // beneath the repository and not beneath the project; a pattern, a
  // path that leaves the repository or a file of the project is refused.
  // They are staged where they are for every action of the project, and
  // are inputs of each.
  repeated string workspace_files = 10;
  // Always_arranged says actions with dependency inputs are arranged even
  // when none resolve to workspace handoffs: their tool needs workspace files
  // (a manifest and a lock narrowed to the packages present). Without it, such
  // actions are arranged only when something is handed. Actions without
  // dependency inputs are not arranged.
  bool always_arranged = 11;
}

// GeneratedSource is a worker-produced contribution to a source collection.
// The host hides matching checkout files from analysis and action inputs;
// only the producing action's result supplies those files to consumers.
// The action itself writes only beneath its own project: where its output
// goes in the source is said here, by exactly one of directory and
// destination.
message GeneratedSource {
  // Action is the producing action's name in this project.
  string action = 1;
  // Output is an exact, required directory output declared by that action.
  string output = 2;
  // Directory is where the output goes, relative to this project: "." or
  // a directory beneath it. Empty when destination is set.
  string directory = 3;
  // Patterns select authoritative generated files, relative to directory
  // or destination. Checkout files outside these patterns are not hidden. A
  // producer output containing other files is refused. Manifests and
  // configuration cannot be claimed; overlapping regions are refused.
  repeated string patterns = 4;
  // Destination is where the output goes, relative to the repository's
  // root, for a directory outside this project and not holding it, written
  // plainly: no "..", no "." part, no slash at either end, no .frontseat
  // part. Empty when directory is set. Wherever the output goes, if the
  // Component that owns that place is not the one that owns this project,
  // it must say in its catalog file that this project's Component
  // generates it (spec.frontseat.generated); without that the host refuses
  // the project. No Component may be nested beneath the place.
  string destination = 5;
}

// Coordinate names a package in an ecosystem.
message Coordinate {
  // Ecosystem is the ecosystem, e.g. "go", "maven", "npm".
  string ecosystem = 1;
  // Name is the package's name there.
  string name = 2;
}

// Provide is a coordinate a project can be required by, and what a
// project that requires it is handed. A plugin never names another
// project's files: it says what its own project hands over, and the host
// hands it to whatever requires the coordinate.
message Provide {
  // Coordinate is what it is required by.
  Coordinate coordinate = 1;
  // Sources is the name of an input set of the project: the files handed
  // over, as they are. No action runs to hand them over. Empty for a
  // project that hands nothing.
  string sources = 2;
  // Artifacts are exact outputs of this project's own finite actions.
  // Each is handed by digest, retaining its path beneath the provider root,
  // under the consumer's dependency input placement. They are never source globs.
  // Output.optional is inherited: a missing required output fails, while
  // a missing optional output contributes no files. Home outputs and shared
  // fetches are not served here.
  repeated Produced artifacts = 3;
}

// Produced selects one declared output, without exposing another plugin's
// action names to consumers of the providing coordinate.
message Produced {
  // Action is the producing action's name in the providing project.
  string action = 1;
  // Output is an exact project-relative output of that action.
  string output = 2;
}

// Requirement is something a project needs. The host finds what provides
// it: a project of the workspace, or nothing, which leaves it to come
// from outside.
message Requirement {
  // Coordinate is what is needed.
  Coordinate coordinate = 1;
  // Origin is where the ecosystem's own files say so, and is required:
  // the host refuses a requirement without a file and a line. An edge
  // is shown with it, so that whoever asks why one project needs another
  // is pointed at the line.
  Origin origin = 5;
  // Version is the version the project's own files resolve it to, as the
  // ecosystem spells it: v1.2.3 for Go (its go.mod, whose versions the
  // go.sum locks), 1.2.3 for Cargo (Cargo.lock). Empty where they say
  // none. Where the workspace provides it, what is built is the
  // provider's source, whatever this says.
  string version = 6;
}

// Origin is a place in a file of the repository.
message Origin {
  // Path is the file, relative to the repository's root and within it.
  string path = 1;
  // Line is the line in it, from 1.
  int32 line = 2;
}

// Action is one hermetic command. The host composes its label from the
// entity that owns its project, the plugin's name and the action's name.
message Action {
  // Name is its name within the project, lower-case words of [a-z0-9]
  // joined by single hyphens. Plugins use the same names for the same
  // things, since a run can be asked for only the actions of one name:
  // lint, compile, test. A shared fetch's name is that, a slash, and
  // what it is of, in letters, digits and "._~+@-/":
  // fetch/github.com/spf13/cobra@v1.8.1.
  //
  // A project's tests may be several actions, each a piece of them the
  // project's tool tests by itself: a test is named "test", or "test", a
  // slash and what piece it is, in the same letters, digits and
  // "._~+@-/", as its tool spells it: test/internal/ledger for a
  // package of a Go module, test/. for the package at its root. A run
  // asked for the actions named "test" is asked for every piece, and
  // the label that ends in "test" points at them all. Only a test is
  // named so, and a project has "test" or pieces of it, never both.
  //
  // A piece may be cut into shards, each an action that runs a share of
  // the piece's tests: a shard is named its piece, "@", which of them it
  // is and of how many, from 1, as test/internal/ledger@2of4. No piece's
  // own name holds "@". The label of a piece that is cut into shards
  // points at its shards.
  //
  // An action that publishes is named "publish", a slash and what it
  // publishes to, in lower-case words of [a-z0-9] joined by single
  // hyphens: publish/github. Only one that publishes is named so.
  string name = 1;
  // Command is what it runs.
  Command command = 2;
  // Inputs are the one list of what this action reads. Their kinds are
  // explicit: a source pattern never selects an output or an input set.
  // The host infers ordering from produced inputs and dependency artifacts;
  // there are no ordering-only edges.
  repeated Input inputs = 3;
  // Outputs are what it writes.
  repeated Output outputs = 4;
  // Tools are the tools it runs with, by name, at the versions the
  // repository pins.
  repeated string tools = 5;
  // Versioned says the action is given the version of the release it is
  // built for, to write into what it makes: a program's own answer to
  // --version, a package's version, an image's label. Each tool has its
  // own way to carry one, and the action's command is that way.
  //
  // The host fills these, wherever they stand in the command's arguments
  // and in the values of its environment, before the action is what it
  // is:
  //
  //   - {frontseat.version}, the version: "1.4.0";
  //   - {frontseat.tag}, the tag the release is given: "greet/v1.4.0";
  //   - {frontseat.commit}, the commit the release is planned at;
  //   - {frontseat.unit}, the unit released, as an entity:
  //     "component:lab/greet".
  //
  // Only the build a release makes for production fills in what was
  // planned for the unit the action's project is released with. Every
  // other build fills in the same values each time, "0.0.0-dev" for the
  // version and nothing for the rest, so that the action is the same
  // action from one commit to the next and is built once. No time, user
  // or machine is ever filled in: the build a release makes of a commit
  // is the same wherever it is made.
  //
  // Whatever begins "{frontseat." is the host's to read: one in an action
  // that does not say it is versioned, one the host does not fill or
  // that does not close, and one anywhere but an argument or a value of
  // the environment, are refused. A versioned action names at least one.
  // A fetch, a shared fetch, a program and what publishes are never
  // versioned: what publishes is filled whether or not it says so.
  //
  // What is filled in is data: give it to a tool as an argument or a
  // value of its own, never inside text a shell reads as a program.
  bool versioned = 6;
  // Kind is what the action is to a build, and is required: the host
  // refuses an action that says none. What only one kind of action says,
  // it says in its kind.
  oneof kind {
    // Build is an ordinary step of a build: it makes what other actions
    // read, and fails the build where it fails.
    Build build = 7;
    // Test runs tests.
    Test test = 8;
    // Check checks the source.
    Check check = 9;
    // Fetch fetches what its project requires from outside.
    Fetch fetch = 10;
    // Shared_fetch fetches one thing a lock holds, for every project of
    // the repository that locks it alike.
    SharedFetch shared_fetch = 11;
    // Program is a program to run, and no step of a build.
    Program program = 12;
    // Package makes what its project ships.
    Package package = 13;
    // Publish publishes what a release shipped.
    Publish publish = 14;
  }
}

// Build is the kind of an ordinary step of a build. It says nothing more.
message Build {}

// Test is the kind of an action that runs tests: where it fails, a test
// failed, and the build is not broken.
message Test {
  // Idle_without_inputs says the test has nothing to do where one
  // output of another action that it reads was not left: an output its
  // action may pass without leaving (Output.optional). It is then not
  // run, ends as idle, which fails nothing, and what waits for it goes
  // on. Without this, such a test runs and finds nothing there.
  //
  // It is for work whose tool decides, on the worker, whether there is
  // any: a test of a Go package runs the test program the go command
  // built for it, and is idle where the go command built none, as for a
  // package whose tests are for another system. A plugin then does not
  // have to foretell what its tool will leave. A test that says so
  // and reads, by itself, no output another action may pass without
  // leaving is refused, as is one that says it leaves something: an
  // action that may not run leaves nothing another can count on.
  bool idle_without_inputs = 1;
}

// Check is the kind of an action that checks the source and writes
// nothing: it fails on what it finds, by its exit code or by the
// findings the plugin reads from what it printed (Report), and passes
// otherwise. On the grid, and so in CI, that is all a check is.
message Check {
  // Fix is the command that puts right what the check finds, such as
  // gofmt -w where the check is gofmt -l. It never runs on the grid: a
  // run asked to fix runs it where the checkout is, in the daemon's own
  // sandbox, over a copy of the check's inputs, with the same tools the
  // check runs with; the host compares the copy with what the run read
  // and writes each difference over that, through the snapshot, which
  // refuses a file that has changed since. The check then runs on the
  // grid over what was written. Absent, the check has no fix.
  Command fix = 1;
  // Rewrites are patterns over the check's inputs, relative to its
  // project, of the files its fix may change: what the host compares
  // after the fix has run. One that differs is a replacement, one that
  // is gone a deletion, and one that is new, and that the check's inputs
  // would have selected, a creation. A check has rewrites where it has
  // a fix, and none where it has none.
  repeated string rewrites = 2;
}

// Fetch is the kind of an action that fetches what its project requires
// from outside the workspace, with the ecosystem's own tool, from the
// project's lock. It is the one kind of action, with a shared fetch,
// that reaches outside its sandbox: the worker points its tool at the
// proxy. It reads what it is given and nothing else, so that only a
// change to the lock fetches again.
message Fetch {}

// SharedFetch is the kind of a fetch that belongs to no project: a fetch
// of one thing a lock holds, the same whichever project of the
// repository locks it alike. It reads no source, is handed nothing and
// needs nothing; it runs in a directory of its own with its tools and
// its files alone, so a run of the repository runs it once, and its
// label is the repository's, not the project's. Two projects that
// declare a shared fetch of one name differently are refused, naming
// both.
message SharedFetch {
  // Files are written into the action's directory before it runs, by
  // path relative to it, or into its home ("~/..."): what it is told of
  // the lock entry it fetches, or writes beside what it downloads. They
  // are part of what the action is. A shared fetch of something its lock
  // holds whole, as an apk lock holds a signing key, has files and
  // outputs and neither a command nor downloads: it reaches nothing, and
  // its files are what it leaves.
  repeated File files = 1;
  // Downloads are what it brings from outside without running a tool:
  // each a URL and what the lock holds of what it serves. Where the lock
  // holds the sha256 of the whole of it, the host fetches it through the
  // grid's asset service, which checks the sha256 before it keeps
  // anything, and keeps it by URL and sha256 for every repository and
  // daemon of the grid; the action then unpacks what was fetched, a
  // gzipped tar, as a crate or an npm package is. Where the lock holds
  // checksums of parts of it and none of the whole, as an apk lock does,
  // the asset service fetches it unchecked, and the action cuts each
  // part out and checks it, leaving nothing where one is not what the
  // lock says. Either way the action has no network. A shared fetch with
  // downloads has no command.
  repeated Download downloads = 2;
}

// Program is the kind of a program to run, and no step of a build: no
// build runs it, and a run (RunService of the build API) runs it and
// nothing else. Its command is the program and what it is given first;
// whoever runs it gives the rest. It runs where the daemon is, in the
// daemon's own sandbox, in its project's directory there, until it ends
// or is stopped. What it reads is what its inputs name of what other
// actions left (the output inputs "compile" and "~/go/bin/"), brought
// from the grid: a run builds those first, as any build does. Its
// program is named by where one of them left it, beneath the project or
// in the action's home ("~/go/bin/greeter"), never a program of the
// system's.
//
// It is named "run/" and what it runs, in letters, digits and "._-":
// run/greeter. It leaves nothing.
//
// A Component's service for tests (spec.frontseat.service.program)
// prepares declared source, input sets, generated inputs and pinned
// tools through the ordinary action preparation path. A bare executable
// must resolve inside those prepared mise installations. RunService in
// the daemon still accepts artifact-only programs and refuses source and
// tools. Ports, readiness, endpoints and API bindings belong to the
// catalog's service. The program's environment is its command's: what
// runs is the command.
message Program {}

// Package is the kind of an action that makes what its project ships: a
// program for a platform, a package, a module, an archive, as its tool
// makes it. Each file it leaves is an artifact of the release that
// builds it, known by its own name, as the tool wrote it, with what the
// grid holds of it: its sha256 and its size.
//
// What a release builds is what a production build builds, so a package
// that costs what a development build should not pay, as a program made
// for every platform does, is declared for the production profile alone,
// and is tried without a release by a production build pointed at it.
//
// It leaves at least one thing, each a file it is sure to leave. Plugins
// name it "package", or "package", a slash and what it is of, as
// "package/linux-amd64", where nothing of their tool's has a name for it
// already.
message Package {}

// Publish is the kind of an action that publishes what a release
// shipped: it runs its tool's own way of sending a release somewhere, a
// forge's command line, a registry's client, and nothing of frontseat's
// speaks for it.
//
// It is no step of a build: no build runs it, and nothing reads what it
// leaves, which is nothing. A release runs it, once every tag of the
// release is pushed, where the daemon is and never on the grid, with its
// tools as the repository pins them, and never from a cache: what it
// does is done outside, each time.
//
// It is run for a unit that moves: the one that owns its project, or,
// where no entity owns its project, as at a repository's root, each unit
// of its repository that moves, one at a time. It is given that unit's
// artifacts, each file a package of the unit left, brought from the grid
// into one directory, with a file of their sha256s beside them where
// there are any, checksums.txt. It is ended after thirty minutes. Its
// command names what it is given as a versioned action names the
// version, and is filled the same way, with those and with:
//
//   - {frontseat.artifacts}, as an argument by itself: each of those
//     files, an argument each, in the order of their names;
//   - {frontseat.notes}: a file that holds the unit's release notes;
//   - {frontseat.remote}: where the unit's repository was brought
//     from, as its version control system names it;
//   - {frontseat.prerelease}: "true" where the release is a
//     prerelease, "false" where it is not.
//
// It passes or fails by its exit code, and the release says which, with
// what it printed; one that fails does not stop another. It reads
// nothing, since it is given its unit's artifacts.
message Publish {
  // Environment names the variables of where the daemon runs that the
  // action is given, each as it is there: what its tool reads a token
  // from, as GH_TOKEN. One that is not set there is not given, and the
  // tool says what it lacks. Its environment holds nothing else of
  // where the daemon runs; it runs as the daemon does.
  repeated string environment = 1;
}

// Input is one selection of files an action reads. A kind must be set.
// Input sets may contain only source patterns and other input sets.
message Input {
  // Kind distinguishes source selection from produced files and dependencies.
  oneof kind {
    // Source is a pattern relative to the project, in the pattern language
    // host.proto says, with an optional ! exclusion. Its contents are
    // always a pattern, including a leading : or = character.
    string source = 1;
    // Input_set is the name of a source input set declared by the project.
    string input_set = 2;
    // Output names a declared output of this plugin's own project, or an
    // action for all its outputs, including a shared fetch by its whole name.
    // There is no leading colon. The name must resolve uniquely; ambiguous,
    // missing and outputless producers are refused. An exact output keeps
    // its declared path, including ~/ for an output in the action's home.
    string output = 3;
    // Dependency selects the handoffs of declared project requirements.
    DependencyInput dependency = 4;
  }
}

// DependencyInput selects project requirements and places their workspace
// handoffs. Transitive requirements are included. Requirements without a
// workspace provider remain external, as in the project's requirement graph.
message DependencyInput {
  // Selection names all requirements or exactly one declared requirement.
  oneof selection {
    // All selects every requirement of this project.
    AllRequirements all = 1;
    // Coordinate selects a requirement already declared by this project.
    // It selects the provider, never a producer action of another plugin.
    Coordinate coordinate = 2;
  }
  // Into is required: a directory relative to the consuming project, with
  // {name} replaced by each handed coordinate's name, or {root} alone to
  // preserve the provider's directory in the same repository. The host tells
  // the plugin the resolved relative directory in Handed.into. Artifact-only
  // handoffs at the same root may use "."; sources may not cover their own
  // root. Artifact paths retain their provider-relative layout beneath Into.
  string into = 3;
}

// AllRequirements selects every requirement of a project: see
// DependencyInput.all. It says nothing more.
message AllRequirements {}

// Download is one thing a shared fetch brings from outside: see
// Action.downloads. It is unpacked whole (sha256 and into) or cut into
// parts (parts), never both.
message Download {
  // Url is the public address of what is downloaded, https. The grid's
  // deployment says which proxy stands in for each public site; a URL no
  // proxy stands in for is refused.
  string url = 1;
  // Sha256 is the hex sha256 of what the URL serves, as the lock holds
  // it. Empty where the download is cut into parts.
  string sha256 = 2;
  // Into is the directory of the action's home ("~/...") the archive is
  // unpacked into, as tar -xz -C does: each of its entries at its own
  // path beneath it. Empty where the download is cut into parts.
  string into = 3;
  // Parts are the runs of bytes kept of what the URL serves, each as a
  // file, where the lock holds a checksum of each and none of the whole.
  // Nothing else of the download is kept.
  repeated Part parts = 4;
}

// Part is a run of bytes of a download, kept as a file once it is seen
// to be what the lock says: see Download.parts.
message Part {
  // Offset is where it starts in what the URL serves, from zero.
  uint64 offset = 1;
  // Length is how many bytes it is, more than none.
  uint64 length = 2;
  // Sha1 is the hex sha1 of those bytes, where the lock holds that: an
  // apk's control section is named by its sha1. One of sha1 and sha256
  // is set.
  string sha1 = 3;
  // Sha256 is the hex sha256 of those bytes, where the lock holds that.
  string sha256 = 4;
  // Path is the file of the action's home ("~/...") the bytes are kept
  // as.
  string path = 5;
}

// ReportRequest asks what a check found.
message ReportRequest {
  // Context is what holds where the project is: its options and tools.
  Context context = 1;
  // Root is the project's directory, relative to the repository.
  string root = 2;
  // Action is the check's name.
  string action = 3;
  // Exit_code is how it ended.
  int32 exit_code = 4;
  // Stdout is what it printed, cut to its first MiB at a line's end.
  bytes stdout = 5;
  // Stderr is what it printed to standard error, cut to its first MiB
  // at a line's end.
  bytes stderr = 6;
}

// ReportResponse is what a check found.
message ReportResponse {
  // Diagnostics are the findings: each with a rule id the plugin
  // qualifies, "go/vet", and a location relative to the repository, the
  // repository left empty for the host to bind. At most 10,000; more is
  // refused.
  repeated frontseat.type.v1alpha1.Diagnostic diagnostics = 1;
}

// Command is a command line.
message Command {
  // Arguments are the program and its arguments. The program is found on
  // the action's tools.
  repeated string arguments = 1;
  // Environment is its environment. It sees nothing else of the worker's.
  map<string, string> environment = 2;
  // Directory is where it runs: a directory beneath its project,
  // relative to it, for a tool that reads what it is given from where it
  // stands, as a Go package's test program opens its fixtures. Empty, it
  // runs in its project's directory. One that is not beneath the project
  // is refused. Only an action's command says one: a fix and a program
  // to run that do are refused by name until that is served.
  string directory = 3;
}

// Output is something an action writes.
message Output {
  // Path is where it is written, relative to the project; a directory's
  // ends in a slash. One that starts with "~/" is in the action's home,
  // which every action has of its own: where a tool keeps what it
  // fetched, and where an action that needs it finds it without being
  // told.
  string path = 2;
  // Optional says the action may pass without leaving it: its tool
  // writes it for some of what it is given and not for the rest, and
  // what was given cannot be told apart beforehand. An action that
  // needs this one then finds nothing there. Without it, an action that
  // passes and does not leave an output has failed.
  bool optional = 3;
}

// InputSet is inputs declared once, by name.
message InputSet {
  // Name is what an action's input_set variant names it by.
  string name = 1;
  // Inputs are patterns relative to the project, or other sets. A set
  // is of source: what an action left is named in an action's own
  // inputs, never in a set.
  repeated Input inputs = 4;
  // Accepts_generated includes generated contributions selected by these
  // patterns. Nested sets retain their own selections; exclusions in the
  // final action or provider selection still apply. Snapshot-only inputs do
  // not acquire generated content merely by sharing an action with this set.
  bool accepts_generated = 3;
}

// File is a file with its content.
message File {
  // Path is where it is: relative to the repository, or, among a shared
  // action's files, relative to the action's directory or in its home
  // ("~/..."). A file an
  // Arrange writes is beneath its project, or directly in a directory
  // above it where the tool reads it for the whole workspace (a
  // workspace manifest narrowed to the projects present, in place of
  // the repository's); never in a directory beside the project, which
  // may be another's, and above the project never a workspace file the
  // project reads, so that nothing a run read is shadowed.
  string path = 1;
  // Content is its bytes.
  bytes content = 2;
  // Executable is whether it is executable.
  bool executable = 3;
}

// ReconcileRequest is what the source says of the entities of one
// analyzed root, for the plugin to say what their files should say.
message ReconcileRequest {
  // Context is the profile, options and tools, as for every call.
  Context context = 1;
  // Root is the analyzed directory the entities were found beneath.
  string root = 2;
  // Entities are the entities of files out of step, with what the
  // source says of each.
  repeated Resolved entities = 3;
}

// Resolved is an entity and what the source says of it: components only,
// since only components are inferred.
message Resolved {
  // Ref is the entity, as the plugin answered it.
  frontseat.type.v1alpha1.EntityRef ref = 1;
  // Manifest is the file that describes it, relative to the repository.
  string manifest = 2;
  // Depends_on are the components it depends on, as inferred, sorted.
  repeated frontseat.type.v1alpha1.EntityRef depends_on = 3;
  // Dependency_of are the components that depend on it, as inferred,
  // sorted: for a file that states the inverse too.
  repeated frontseat.type.v1alpha1.EntityRef dependency_of = 4;
}

// ReconcileResponse is the edits that make the files say what the
// source says; a file already saying it needs none.
message ReconcileResponse {
  // Edits are applied in order, each over the file as the one before
  // left it.
  repeated Edit edits = 1;
}

// Edit sets a sequence of strings at a key path of one document of a
// file; with no values, it removes the key. The path is a manifest of
// the request; the document is counted from zero in the file's stream.
// The host writes it keeping every other key, comment and document.
message Edit {
  // Path is the file, a manifest of the request.
  string path = 1;
  // Document is which document of the file's stream, from zero.
  int32 document = 2;
  // Keys is the path of mapping keys from the document's root to the
  // sequence.
  repeated string keys = 3;
  // Values are the strings the sequence holds afterwards; none takes
  // the key out.
  repeated string values = 4;
}
