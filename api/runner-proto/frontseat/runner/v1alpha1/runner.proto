// frontseat.runner.v1alpha1: what a worker's runner is told to start for a
// test. It is no API: nothing serves it and no client asks it. It is a
// file the daemon writes and the runner reads, both of this server, and
// its Go is theirs alone (common/runner/runnerapi).
//
// It lists every service a test needs, those its services need
// included, and which of their ports the test and each service may
// reach. The worker's runner makes a sandbox for the test and one for
// each service, each with a loopback of its own and no other network.
// The daemon has already worked out what to start, from the Resources
// the test's Component depends on and the APIs it consumes. It writes
// the file into the action's input root, at
// .frontseat/runtime/runner.binpb, so that it is part of the action's
// digest and nothing outside the Remote Execution API carries it; the
// runner reads it there.
syntax = "proto3";

package frontseat.runner.v1alpha1;

import "frontseat/type/v1alpha1/service.proto";

// RunnerSandbox is what a runner starts for one test: its services, and
// the ports of them the test may reach. A service is started once what
// it depends on is ready. Each runs with no network but its own
// loopback, on which the ports it is given here are forwarded.
message RunnerSandbox {
  // Services are the services, each after every service it depends on.
  repeated RunnerService services = 1;
  // Routes are the ports of the services the test may reach, and no
  // others.
  repeated RunnerRoute routes = 2;
}

// RunnerService is one service of a runner sandbox.
message RunnerService {
  // Name names it within this file: no two services share one. It is a
  // plain name the daemon makes, and is not the entity's reference.
  string name = 1;
  // Service is how it is started, with every address filled in and how
  // long it is given to be ready said. What it is ready by names its
  // ports, which are ports of the sandbox's loopback. It exports
  // nothing here, and says no endpoint: what the action is told is the
  // action's own.
  frontseat.type.v1alpha1.Service service = 2;
  // Entity is the reference, written in full, of the entity the service
  // is of.
  string entity = 3;
  // Program is the program to start, for a service whose program was
  // prepared for it; unset for one that runs its image's entrypoint.
  RunnerProgram program = 4;
  // Routes are the ports of other services this service may reach.
  repeated RunnerRoute routes = 5;
}

// RunnerRoute is one port of one service that a test or another service
// may reach. Whoever is given the route reaches that port and nothing
// else, and does not choose where the route leads.
message RunnerRoute {
  // Service is the name of the service reached, as this file names it.
  string service = 1;
  // Port names the port of that service that is reached.
  string port = 2;
  // `local_port` is the port on the loopback of whoever is given the
  // route, at which the service's port is reached.
  int32 local_port = 3;
  // Api is the reference, written in full, of the API the port serves,
  // for a route to a Component's service: such a route reaches the port
  // of that API and no other port of the Component. Empty for a route
  // to a Resource.
  string api = 4;
}

// RunnerProgram is a service's program, prepared before the action
// runs: it and what it needs were placed in the action's input root.
// The runner starts no program from anywhere else.
message RunnerProgram {
  // Root is the directory that holds the program and what it needs,
  // beneath .frontseat/runtime/ in the action's input root.
  string root = 1;
  // Directory is the directory the program is started in, beneath
  // root.
  string directory = 2;
  // Arguments are the command that starts it. The command is
  // Frontseat's confiner, which confines itself, sets the environment
  // the program was prepared with, and then runs the program.
  repeated string arguments = 3;
  // Image is the image the program was prepared with, named so that
  // what it names cannot change.
  string image = 4;
  // Platform is the platform the program was prepared on, as
  // properties by name; OSFamily and ISA are among them.
  map<string, string> platform = 5;
}
