// frontseat.runner.v1alpha1: what a worker's runner is told to start for a
// test. It is no API: nothing serves it and no client asks it. It is a
// file the daemon writes and the runner reads, both of this server, and
// its Go is theirs alone (server/internal/runnerapi).
//
// The test's service closure and its direct endpoint grants. The worker's
// runner makes separate sandboxes for the test and each service, each with
// a private loopback and no external network. The daemon says what to start,
// already resolved from Resource dependencies and API relationships,
// in the action's input root, at .frontseat/runtime/runner.binpb, so that
// it is part of the action's digest and nothing outside the Remote
// Execution API carries it; the runner reads it there.
syntax = "proto3";

package frontseat.runner.v1alpha1;

import "frontseat/type/v1alpha1/service.proto";

// RunnerSandbox describes isolated services and the action's direct routes.
// Dependencies become ready before a dependent starts. Each process has its
// own blocked network; only explicitly granted endpoints are forwarded.
message RunnerSandbox {
  // Services are in dependency order, with each dependency appearing first.
  repeated RunnerService services = 1;
  // Routes are the only service endpoints granted to the action.
  repeated RunnerRoute routes = 2;
}

// RunnerService is one service of a runner sandbox.
message RunnerService {
  // Name is a unique plain runtime name, independent of its entity's spelling.
  string name = 1;
  // Service is how it is started, with every address filled in and how
  // long it is given to be ready said. What it is ready by names its
  // ports, which are ports of the sandbox's loopback. It exports
  // nothing here, and says no endpoint: what the action is told is the
  // action's own.
  frontseat.type.v1alpha1.Service service = 2;
  // Entity is the canonical identity owning this runtime.
  string entity = 3;
  // Program describes a prepared program; absent for an image entrypoint.
  RunnerProgram program = 4;
  // Routes are this service's direct dependencies, not the action's.
  repeated RunnerRoute routes = 5;
}

// RunnerRoute is one fixed endpoint, never a caller-selected destination.
message RunnerRoute {
  // Service is the name of the provider in this description.
  string service = 1;
  // Port names a listening port of that provider.
  string port = 2;
  // Local_port is the endpoint on the consumer's private loopback.
  int32 local_port = 3;
  // Api is the canonical API whose mapped port this grants. Empty only
  // for a Resource dependency; it grants no other port of a Component.
  string api = 4;
}

// RunnerProgram starts only what preparation placed in the action's root.
message RunnerProgram {
  // Root is the private runtime root beneath .frontseat/runtime/.
  string root = 1;
  // Directory is the working directory beneath that runtime root.
  string directory = 2;
  // Arguments start the trusted confiner, which sets the
  // program's prepared environment inside confinement before executing it.
  repeated string arguments = 3;
  // Image is the immutable image used to prepare this program.
  string image = 4;
  // Platform records the preparation platform, including OSFamily and ISA.
  map<string, string> platform = 5;
}
