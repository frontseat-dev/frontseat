// frontseat.workspace.v1alpha1: workspaces. A workspace is a working area
// of repositories joined into one graph, for a person, an agent or a job.
// It lives in a sandbox, which is its isolation and knows nothing of it,
// and a daemon there holds its source and builds it: one workspace and
// one daemon in a sandbox, which this API has no way to say otherwise.
//
// The control plane alone serves this service, and is the one writer of
// what a workspace is asked for: it makes a sandbox for a new one, tells
// the daemon there what to hold and reads back what it holds, and ends
// one. It also forwards calls to each workspace's build API, and
// connections to its shell and to a port of its sandbox, by the
// workspace's name, and forwards nothing else to a workspace. A
// workspace is changed from outside it: inside its sandbox its source is
// fixed, and the command line there calls its daemon's build API alone.
//
// Every call to a control plane is a person's, known by the token they
// present as a bearer token. A call that presents none is refused
// UNAUTHENTICATED with the reason IDENTITY_MISSING, and one whose token
// the control plane does not know with IDENTITY_INVALID, each in
// ErrorInfo of the control plane's own domain, frontseat.dev, in which
// every service it serves refuses a caller it does not know; a call
// forwarded to a workspace's build API, and a connection to its shell
// or to a port of its sandbox, are held to the same. A workspace belongs
// to its owner, the caller who asked for it first. Its name is unique
// among all the workspaces of a control plane, whoever owns them. A
// caller who names a workspace
// that is another's is refused PERMISSION_DENIED with the reason
// NOT_OWNER, by every call of this service, and no caller is listed
// another's workspaces. What this service refuses by name carries ErrorInfo of
// the domain workspace.frontseat.dev, with the reason each call names.
// A call sent to a workspace's build API address that is not a call of
// the build API is not forwarded: it is refused UNIMPLEMENTED with the
// reason CALL_NOT_SERVED.
//
// A connection to a port of a workspace's sandbox is asked for at
// /workspaces/{name}/ports/{port} of the control plane's address, as a
// WebSocket, and to its shell at /workspaces/{name}/shell. Each is the
// workspace's owner's alone, and anyone else is refused NOT_OWNER as
// above. What is written to the WebSocket, in binary messages, is what
// is connected to the port inside the sandbox reads, and what that
// writes is read from it: the control plane carries the bytes and knows
// nothing of what speaks there. The connection ends, both ways, when
// either end does. {port} is the port's number, from 1 to 65535, in
// digits alone. A connection is carried to any port but one, the port
// of the daemon's internal source API, which is the control plane's
// own: that port, and whatever is written for {port} that is no port
// so written, is refused UNIMPLEMENTED with the reason PORT_NOT_SERVED,
// as a call is refused, and nothing is asked of the sandbox. A refusal
// is answered in place of the WebSocket, as the Connect protocol writes
// a unary call's error. A workspace that is in no sandbox yet, and a
// port nothing in the sandbox listens on, are no refusal by name: the
// answer is an HTTP status that is not the WebSocket's.
//
// A workspace is kept as what was asked for, its spec, and what is so,
// its status. A call writes the spec and returns; the control plane then
// works until the status matches it. It works from the spec it keeps: a
// control plane or a daemon that was stopped and started again carries
// on from there, and the daemon is told again what to hold.
syntax = "proto3";

package frontseat.workspace.v1alpha1;

import "frontseat/type/v1alpha1/types.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// WorkspaceService is the workspaces of a control plane.
service WorkspaceService {
  // CreateWorkspace gives the workspace of a name: the one there is, or a
  // new one. It returns at once; the workspace can be worked in when
  // WaitWorkspace ends with STATE_READY.
  //
  // Where the caller already owns a workspace of the name, and the spec
  // asks for what that workspace has or less, in any order, the call
  // returns that workspace, however often it is made: a paused one is
  // resumed, and a failed one is tried again. Nothing is ended by this
  // call, whatever fails.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the spec asks for no repository and no entity
  //   (SOURCE_MISSING); the name is not a valid workspace name, as
  //   Workspace.name says, or none is given and nothing asked for gives
  //   one (NAME_INVALID); a repository's address holds a user or a
  //   password (REMOTE_CREDENTIALED); an address is not written plainly,
  //   a host is fetched from over both http and https, or the authorized
  //   key is not one line (SPEC_INVALID); the lifetime is zero or
  //   negative (LIFETIME_INVALID); an entity's reference is not a valid
  //   one, or the catalog says of the entity what a workspace cannot
  //   hold (ENTITY_INVALID); a reference matches several entities, which
  //   the message names (ENTITY_AMBIGUOUS).
  // - PERMISSION_DENIED: a workspace of the name is another's
  //   (NOT_OWNER).
  // - NOT_FOUND: the catalog holds no entity of a reference given, or
  //   none that such an entity depends on (ENTITY_NOT_FOUND).
  // - UNIMPLEMENTED: entities are named, and the control plane resolves
  //   none because its operator gave it no catalog (ENTITIES_NOT_SERVED);
  //   no image is named, and the control plane has none of its own
  //   (IMAGE_NOT_SERVED); a repository is to be fetched, and the control
  //   plane was configured with no version control system
  //   (FETCH_NOT_SERVED); a push is asked for, and a repository is not
  //   given by its address over http or https (PUSH_NOT_SERVED).
  // - UNAVAILABLE: the catalog did not answer, or answered what is not a
  //   catalog's answer; nothing is made (ENTITIES_UNAVAILABLE).
  // - ALREADY_EXISTS: the caller's workspace of the name is asked for
  //   with more than it has: other source, a push it was made without,
  //   another image, another authorized key or another lifetime; the
  //   message says what differs (WORKSPACE_DIFFERS).
  // - FAILED_PRECONDITION: the workspace of the name is ending; it is
  //   asked for again once it is gone (WORKSPACE_ENDING).
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // DescribeWorkspace returns one workspace: what was asked for, and what
  // is so, as it was last found.
  //
  // ### Errors
  // - NOT_FOUND: there is no workspace of the name (WORKSPACE_NOT_FOUND).
  // - PERMISSION_DENIED: the workspace is another's (NOT_OWNER).
  rpc DescribeWorkspace(DescribeWorkspaceRequest) returns (DescribeWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListWorkspaces returns the caller's workspaces, oldest first, a page
  // at a time. A page token names a position in that list: where a
  // workspace is deleted between two pages, the next page may leave one
  // out.
  //
  // ### Errors
  // - INVALID_ARGUMENT: the page token is not one this call gave
  //   (PAGE_TOKEN_INVALID).
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // WaitWorkspace returns a workspace once it is ready, has failed or is
  // paused. One whose sandbox does not come to run, or whose daemon does
  // not come to answer, has failed. One that is ending is waited for
  // until it is gone, and waiting then ends NOT_FOUND. A call that is
  // cut off can simply be made again.
  //
  // ### Errors
  // - NOT_FOUND: there is no workspace of the name (WORKSPACE_NOT_FOUND).
  // - PERMISSION_DENIED: the workspace is another's (NOT_OWNER).
  rpc WaitWorkspace(WaitWorkspaceRequest) returns (WaitWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateWorkspace adds repositories and entities to a workspace. Its
  // spec is given whole: everything the workspace has, and what is
  // added. Nothing can be taken away, and the fields of the spec that
  // are set once cannot be changed. The control plane tells the
  // workspace's daemon to clone what is new. Where the daemon refuses,
  // the call is refused and the workspace keeps the spec it had. The
  // call returns once the daemon has accepted; WaitWorkspace returns
  // when what was added is there.
  //
  // Entities added are resolved as CreateWorkspace resolves them, and
  // refused with the same reasons; those it had are not resolved again.
  //
  // ### Errors
  // - NOT_FOUND: there is no workspace of the name
  //   (WORKSPACE_NOT_FOUND); the catalog holds no entity of a reference
  //   added (ENTITY_NOT_FOUND).
  // - PERMISSION_DENIED: the workspace is another's (NOT_OWNER).
  // - INVALID_ARGUMENT: the spec leaves out something the workspace has
  //   (SPEC_INCOMPLETE); it changes a field that is set once: whether it
  //   pushes, its author, its authorized key, its image or its lifetime
  //   (SPEC_FIXED); a repository's address holds a user or a password
  //   (REMOTE_CREDENTIALED); an entity added is refused as
  //   CreateWorkspace refuses one (ENTITY_INVALID, ENTITY_AMBIGUOUS). Or
  //   the daemon refuses what is added, with the reason it gives: it
  //   cannot hold a repository added where it holds its source
  //   (SOURCE_UNFIT), or was told no repository (SOURCE_MISSING) or no
  //   valid generation (GENERATION_INVALID).
  // - FAILED_PRECONDITION: the workspace is not ready
  //   (WORKSPACE_NOT_READY), or is ending (WORKSPACE_ENDING). Or the
  //   daemon refuses what is added, with the reason it gives: it is
  //   still cloning what it was told before (SOURCE_POPULATING), or it
  //   was started over a directory it was given and clones nothing
  //   (SOURCE_MOUNTED).
  // - UNIMPLEMENTED: a repository added, or one that an entity added
  //   resolved to, is on a host the workspace's sandbox may not reach:
  //   which hosts it may reach is fixed when the workspace is made. The
  //   message says which (REACH_NOT_SERVED). Or entities are added,
  //   and the control plane resolves none (ENTITIES_NOT_SERVED).
  // - UNAVAILABLE: the catalog did not answer, as for CreateWorkspace
  //   (ENTITIES_UNAVAILABLE). Or the workspace's daemon was not reached;
  //   no reason is given then.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);

  // DeleteWorkspace ends a workspace and its sandbox, with what it holds:
  // what was changed there and not pushed goes with it. It returns at
  // once, the workspace ending; it is gone when DescribeWorkspace says
  // NOT_FOUND.
  //
  // ### Errors
  // - NOT_FOUND: there is no workspace of the name (WORKSPACE_NOT_FOUND).
  // - PERMISSION_DENIED: the workspace is another's (NOT_OWNER).
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Workspace is a workspace.
message Workspace {
  // Name names it among all the workspaces of a control plane, whoever
  // owns them: lower-case letters, digits and dashes, at most 48. It is
  // what every command and call says to mean this workspace, and its
  // daemon is told it.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Spec is what it was asked for with.
  WorkspaceSpec spec = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Status is what is so.
  WorkspaceStatus status = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `create_time` is when it was made.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Owner is the caller who asked for it first, as the control plane
  // identifies callers. Only the owner's calls may name it.
  string owner = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// WorkspaceSpec is what a workspace is asked for with.
message WorkspaceSpec {
  // Repositories are repositories for its daemon to clone, each by an
  // address that holds no user and no password.
  repeated RepositorySource repositories = 1;
  // Entities are entities whose source it holds, with the entities they
  // depend on. The control plane looks each up in the Backstage catalog
  // its operator configured, finds the repositories and directories
  // that hold them, and its daemon clones those. A control plane with
  // no catalog configured serves no entities: it refuses a spec that
  // names one UNIMPLEMENTED, with the reason ENTITIES_NOT_SERVED. A
  // reference may be written short, as a person types it: an empty kind
  // means a component, and an empty namespace matches any namespace,
  // provided the catalog holds one entity of that kind and name. The
  // workspace's status says which entity each one resolved to.
  repeated frontseat.type.v1alpha1.EntityRef entities = 2;
  // `whole_repositories` has the daemon clone every file of the
  // entities' repositories, not only the directories the entities own.
  bool whole_repositories = 3;
  // Push lets it push to the repositories named, with the credential the
  // control plane keeps for their hosts. It is set when the workspace is
  // made, and cannot be changed.
  bool push = 4;
  // Author is the name and address its commits are made under; empty
  // for none. It is set when the workspace is made, and cannot be
  // changed.
  Author author = 5;
  // `authorized_key` is the SSH public key that may open its shell, on one
  // line, as an SSH client writes its own public key file; empty for a
  // workspace no one opens a shell in. It is set when the workspace is
  // made, and cannot be changed: CreateWorkspace for a workspace that is
  // there is refused with another key, and with none returns the
  // workspace as it was made.
  string authorized_key = 6;
  // Image is the image its sandbox runs; empty for the control plane's
  // own. It is set when the workspace is made, and cannot be changed.
  string image = 7;
  // Lifetime is how long it lasts from when it was made (its
  // create_time), whether or not it is used. After that the control
  // plane ends it as DeleteWorkspace would: it is meant for the
  // workspace of a job. Empty for one that is kept until it is deleted.
  // It is set when the workspace is made, and cannot be changed:
  // CreateWorkspace for a workspace that is there is refused with
  // another lifetime, and with none returns the workspace as it was
  // made.
  google.protobuf.Duration lifetime = 8;
}

// Author is who commits in a workspace.
message Author {
  // Name is their name.
  string name = 1;
  // Email is their address.
  string email = 2;
}

// WorkspaceStatus is what is so of a workspace.
message WorkspaceStatus {
  // State is where it is.
  State state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Failure says what went wrong: for a workspace that failed, why; for
  // one starting or ending, what is holding it up, which the control
  // plane tries again. Empty where nothing went wrong.
  string failure = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `build_uri` is the address at which its daemon's build API
  // (frontseat.build.v1alpha1) is called. It is an address of the
  // control plane, which forwards calls of that API, and no others, to
  // the daemon. A client uses it as given; a person never types it.
  // Empty until the workspace has a sandbox.
  string build_uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Repositories are the repositories it holds, as its daemon says.
  repeated Repository repositories = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Entities are what the entities it was asked for resolved to, and the
  // components they depend on: each entity, and the repository and
  // directory that hold it. They were resolved once, when each was
  // asked for, and are not resolved again.
  repeated LocatedEntity entities = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is where a workspace is.
  enum State {
    // STATE_UNSPECIFIED: not known.
    STATE_UNSPECIFIED = 0;
    // STATE_STARTING: its sandbox was asked for and its daemon does not
    // answer yet.
    STATE_STARTING = 1;
    // STATE_POPULATING: its daemon is cloning what was asked for.
    STATE_POPULATING = 2;
    // STATE_READY: it holds what was asked for, and can be worked in.
    STATE_READY = 3;
    // STATE_PAUSED: its sandbox is stopped, and what it holds is kept.
    // No call of this service pauses a workspace: it is paused where
    // whoever operates the control plane pauses its sandbox.
    // CreateWorkspace, by its owner, resumes it.
    STATE_PAUSED = 4;
    // STATE_FAILED: its sandbox failed, or its daemon could not clone
    // what was asked for; failure says which. What it held may still be
    // there, and it is ended only by DeleteWorkspace or its lifetime.
    STATE_FAILED = 5;
    // STATE_ENDING: it was asked to end, and its sandbox is being ended.
    STATE_ENDING = 6;
  }
}

// CreateWorkspaceRequest asks for a workspace.
message CreateWorkspaceRequest {
  // Name names it; empty for the name the control plane gives what was
  // asked for: the first entity's name, or else the first repository's,
  // with its ref where one is given ("payments", "services-main").
  string name = 1;
  // Spec is what it is asked for with.
  WorkspaceSpec spec = 2 [(google.api.field_behavior) = REQUIRED];
}

// CreateWorkspaceResponse is the workspace.
message CreateWorkspaceResponse {
  // Workspace is the workspace: made now, or the one that was there, as
  // it was found.
  Workspace workspace = 1;
  // Created is whether it was made by this call.
  bool created = 2;
}

// DescribeWorkspaceRequest asks for one workspace.
message DescribeWorkspaceRequest {
  // Name names it.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// DescribeWorkspaceResponse is the workspace.
message DescribeWorkspaceResponse {
  // Workspace is the workspace.
  Workspace workspace = 1;
}

// ListWorkspacesRequest asks for a page of the workspaces there are.
message ListWorkspacesRequest {
  // `page_size` is the most workspaces to return; zero is a hundred,
  // and more than a thousand is a thousand.
  int32 page_size = 1;
  // `page_token` is the next_page_token of the page before; empty for the
  // first page.
  string page_token = 2;
}

// ListWorkspacesResponse is a page of the workspaces.
message ListWorkspacesResponse {
  // Workspaces are the caller's workspaces, oldest first.
  repeated Workspace workspaces = 1;
  // `next_page_token` asks for the page after this one; empty on the last.
  string next_page_token = 2;
}

// WaitWorkspaceRequest names the workspace to wait for.
message WaitWorkspaceRequest {
  // Name names it, as DescribeWorkspace takes it.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// WaitWorkspaceResponse is the workspace as the wait ended on it.
message WaitWorkspaceResponse {
  // Workspace is the workspace.
  Workspace workspace = 1;
}

// UpdateWorkspaceRequest gives a workspace the spec it is to have.
message UpdateWorkspaceRequest {
  // Name names it, as DescribeWorkspace takes it.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Spec is the spec it is to have: what it had, and what is added.
  WorkspaceSpec spec = 2 [(google.api.field_behavior) = REQUIRED];
}

// UpdateWorkspaceResponse is the workspace as the request left it.
message UpdateWorkspaceResponse {
  // Workspace is the workspace.
  Workspace workspace = 1;
}

// DeleteWorkspaceRequest asks to end one workspace.
message DeleteWorkspaceRequest {
  // Name names it.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteWorkspaceResponse is empty: the workspace is ending.
message DeleteWorkspaceResponse {}

// Repository is one repository of a workspace.
message Repository {
  // Name is the workspace's name for it: what a label and a path name it
  // by.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Remote is where it was cloned from; empty for a directory the daemon
  // was started over and did not clone.
  string remote = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Commit is the commit it stands at.
  string commit = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Roots are the directories taken of it; empty for all of it.
  repeated string roots = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// LocatedEntity is an entity, and where its source is in a workspace.
message LocatedEntity {
  // Ref names the entity in full.
  frontseat.type.v1alpha1.EntityRef ref = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Repository is the workspace's name for the repository that holds it.
  string repository = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Root is its directory in that repository; empty for all of it.
  string root = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RepositorySource is a repository to clone.
message RepositorySource {
  // Remote is its URL.
  string remote = 1 [(google.api.field_behavior) = REQUIRED];
  // Ref is the branch, tag or commit to stand at; empty for the remote's
  // default branch. It is cloned whole, and the workspace names it as
  // its version control system names a clone of the remote: by the last
  // element of the remote's path.
  string ref = 2;
}
