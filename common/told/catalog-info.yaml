apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: told
  namespace: frontseat
  description: "What a box's daemon is told of what a workspace is asked for, and the generated Go of the daemon's source API"
spec:
  type: library
  lifecycle: experimental
  owner: jbadeau
  system: workspaces
  dependsOn: [component:api, component:go-sdk, component:record]
  frontseat:
    # Generated here by the contracts' Buf workspace (api/buf.gen.*.yaml),
    # and nowhere else of this Component.
    generated:
      - directory: sourceapi
        by: component:api
    # The plugin host's tests, and those that load a plugin, run each
    # plugin's wasm module, from where its crate's wasm action left it
    # (testsupport/testmodule), against each plugin's fixtures; the
    # matcher's test holds it to the testkit's shared cases.
    # On the grid there is no local stack to reach: a test that needs one
    # says so first and is skipped, said why, as `mise run check` skips
    # it (testsupport/testrequired); `mise run test` runs it.
    test:
      environment: {FRONTSEAT_TEST_STACK: none}
      # What the tests read of other Components, found where Frontseat
      # tells a test its repository is (FRONTSEAT_TEST_SRCDIR): the Go
      # SDK's module files, which a generated fixture is laid out with;
      # the repository's tool pins, which a fixture is pinned with; and
      # the plugins, by their crates, and their fixtures; and the
      # configuration reference, whose examples the configuration's
      # reader is held to.
      inputs:
        - /docs/configuration.md
        - /sdk/go/go.mod
        - /sdk/go/go.sum
        - /mise.toml
        - /mise.lock
        - /plugins/*/Cargo.toml
        - /plugins/*/testdata/**
        - /sdk/plugin-test/testdata/**
        - //plugins/apko:cargo.package/wasm32-wasip1
        - //plugins/backstage:cargo.package/wasm32-wasip1
        - //plugins/buf:cargo.package/wasm32-wasip1
        - //plugins/cargo:cargo.package/wasm32-wasip1
        - //plugins/container:cargo.package/wasm32-wasip1
        - //plugins/github:cargo.package/wasm32-wasip1
        - //plugins/go:cargo.package/wasm32-wasip1
        - //plugins/jest:cargo.package/wasm32-wasip1
        - //plugins/npm:cargo.package/wasm32-wasip1
        - //plugins/postgres:cargo.package/wasm32-wasip1
        - //plugins/release:cargo.package/wasm32-wasip1
        - //sdk/plugin:cargo.compile/wasm32-wasip1-examples
