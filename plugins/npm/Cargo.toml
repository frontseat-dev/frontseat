[package]
name = "frontseat-plugin-npm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The npm plugin: fetches and installs an npm lock."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
frontseat-plugin = { path = "../../sdk/plugin" }
serde = { version = "1", features = ["derive"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }

[dev-dependencies]
frontseat-plugin-test = { path = "../../sdk/plugin-test" }
