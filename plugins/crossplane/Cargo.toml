[package]
name = "frontseat-plugin-crossplane"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The Crossplane plugin: builds a Configuration into a package and validates its examples."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
frontseat-plugin = { path = "../../sdk/plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
frontseat-plugin-test = { path = "../../sdk/plugin-test" }
