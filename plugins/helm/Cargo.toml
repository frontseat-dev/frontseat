[package]
name = "frontseat-plugin-helm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The Helm plugin: lints and renders Helm charts."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
frontseat-plugin = { path = "../../sdk/plugin" }
serde = { version = "1", features = ["derive"] }
# The SDK reads YAML with serde-saphyr and says no line of a value; its
# Spanned says the line of each dependency a chart names.
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }

[dev-dependencies]
frontseat-plugin-test = { path = "../../sdk/plugin-test" }
