[package]
name = "frontseat-plugin-cargo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The Cargo plugin: builds Rust packages, and, where its option wasm is set, their cdylib libraries and examples to wasm modules."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
frontseat-plugin = { path = "../../sdk/plugin" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
frontseat-plugin-test = { path = "../../sdk/plugin-test" }
