[package]
name = "frontseat-plugin-cargo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The Cargo plugin: builds Rust packages, and plugins to wasm."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
frontseat-plugin = { path = "../../sdk/plugin" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "display", "std", "serde"] }

[dev-dependencies]
frontseat-plugin-test = { path = "../../sdk/plugin-test" }
