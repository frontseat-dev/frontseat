# How this repository is built: by frontseat, with its own plugins. Go
# builds the modules go.work lists, Cargo the SDK and the plugins, each
# package of the workspace on its own and each plugin to wasm, Buf lints
# api/ and generates its Go and Connect source, and Backstage reads
# catalog-info.yaml, the release plugin serves the strategies its
# releases are planned with, and the GitHub plugin publishes them. Each takes its options' own values. What frontseat
# cannot build yet, the images, mise builds; CONTRIBUTING.md says which.
plugins:
  go:
    # What a released frontseat says its version by (frontseat version):
    # the release writes it in where the command line is linked.
    version:
      - github.com/frontseat-dev/frontseat/cli/internal/cmd.version=version
      - github.com/frontseat-dev/frontseat/cli/internal/cmd.commit=commit
  # The plugins and the SDK's conformance examples are wasm modules:
  # each cdylib is built to wasm32-wasip1 too.
  cargo:
    wasm: true
  buf: {}
  backstage: {}
  release: {}
  # A release of this repository is published on GitHub, a GitHub
  # release for each unit it tags, by GitHub's own command line.
  github: {}
