    - ./plugins/buf/catalog-info.yaml
    - ./plugins/cargo/catalog-info.yaml
    - ./plugins/container/catalog-info.yaml
    - ./plugins/go/catalog-info.yaml
    - ./plugins/helm/catalog-info.yaml
    - ./plugins/jest/catalog-info.yaml
    - ./plugins/npm/catalog-info.yaml
    - ./plugins/postgres/catalog-info.yaml
    - ./plugins/github/catalog-info.yaml
    - ./plugins/release/catalog-info.yaml
    - ./sdk/go/catalog-info.yaml
    - ./sdk/plugin/catalog-info.yaml
    - ./sdk/plugin-test/catalog-info.yaml
    - ./build/daemon/catalog-info.yaml
    - ./build/engine/catalog-info.yaml
    - ./cmd/frontseat-box/catalog-info.yaml
