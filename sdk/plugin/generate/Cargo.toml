# What writes the plugin SDK's Rust from the contract's protos
# (src/gen of the SDK): run by `mise run protos` to write it, and by
# `mise run check` to hold what is committed to what it writes now. No
# plugin and no build of the SDK runs it.
[package]
name = "frontseat-plugin-generate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Writes the plugin SDK's Rust from the contract's protos."
publish = false

[dependencies]
prost-build = "0.14"
protox = "0.9"
