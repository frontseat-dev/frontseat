apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cli
  namespace: frontseat
  description: "The command line, over the Go SDK"
spec:
  type: tool
  lifecycle: experimental
  owner: jbadeau
  system: clients
  consumesApis: [api:build-api, api:workspace-api, api:credential-api]
  dependsOn: [component:api, component:confine, component:core, component:git, component:go-sdk, component:stack, component:testsupport]
  frontseat:
    # The command line is shipped for where people and CI run it: each
    # platform is a program of its own in a release, frontseat-<os>-<arch>.
    platforms: [linux/amd64, linux/arm64, darwin/arm64]
